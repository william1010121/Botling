<!doctype html><meta charset="utf-8">
<style>
body { margin:0; font:14px system-ui; background:#f1f6fc; color:#202124; }
.notice { position:fixed; bottom:16px; left:16px; font-size:12px; color:#596579; }
/* Reduced from observed Gemini/Angular CDK structure; no account, conversation or PDF data. */
.cdk-overlay-popover { position:fixed; inset:0 auto auto 0; margin:0; border:0; padding:0; background:none; overflow:visible; pointer-events:none; }
.cdk-overlay-connected-position-bounding-box { display:flex; flex-direction:column; }
.cdk-overlay-pane { display:flex; pointer-events:auto; }
[role=menu] { display:flex; flex-direction:column; padding:8px; width:194px; box-sizing:content-box; border-radius:20px; background:white; box-shadow:0 8px 32px #4561; }
[role=menuitem] { display:block; padding:10px 16px; box-sizing:border-box; height:52px; }
small { display:block; color:#777; }
[aria-haspopup=true] { height:36px; padding:8px 16px; background:#eee; border-radius:12px; }
#main-overlay { inset:auto 28% 28% auto; }
#sub-overlay { inset:0 auto auto 0; width:100vw; height:100vh; align-items:flex-start; justify-content:flex-start; }
#sub-pane { position:static; transform:translateX(4px); }
#sub-menu { width:186px; }
#deep-menu { width:124px; }
</style>
<p class="notice">LOCAL REGRESSION · observed Gemini CDK structure / valid dynamic submenu coordinates</p>
<div id="main-overlay" class="cdk-overlay-popover cdk-overlay-connected-position-bounding-box" popover="manual">
 <div class="cdk-overlay-pane" style="position:static;transform:translateY(4px)">
  <div class="popover-menu" style="overflow:auto"><gem-menu id="main-menu" role="menu" data-visible="true">
   <gem-menu-item role="menuitem">3.5 Flash-Lite<small>Fastest answers</small></gem-menu-item>
   <gem-menu-item role="menuitem">3.8 Flash<small>All-around help</small></gem-menu-item>
   <gem-menu-item role="menuitem">3.1 Pro<small>Advanced reasoning</small></gem-menu-item>
   <gem-menu-item role="menuitem">4 Argon<small>Complex tasks</small></gem-menu-item>
   <gem-menu-item id="trigger" role="menuitem" aria-haspopup="true" aria-expanded="true" aria-controls="sub-menu">Thinking level ›</gem-menu-item>
   <div id="sub-overlay" class="cdk-overlay-popover cdk-overlay-connected-position-bounding-box" popover="manual">
    <div id="sub-pane" class="cdk-overlay-pane"><div class="submenu-container">
     <gem-menu id="sub-menu" role="menu" data-visible="true">
      <gem-menu-item role="menuitem">Low<small>Quick and efficient</small></gem-menu-item>
      <gem-menu-item role="menuitem">Medium<small>Balanced depth</small></gem-menu-item>
      <gem-menu-item role="menuitem">High<small>Extra thorough</small></gem-menu-item>
     </gem-menu>
    </div></div>
   </div>
  </gem-menu></div>
 </div>
</div>
<script>

document.getElementById('main-overlay').showPopover();
{ const a=document.getElementById('trigger').getBoundingClientRect(),p=document.getElementById('sub-overlay');
p.style.cssText='inset:auto;width:202px;height:172px;left:'+(a.right-4)+'px;top:'+a.top+'px';
p.showPopover(); }
window.initialSiteStyle=document.getElementById('sub-overlay').getAttribute('style');

window.ready=true;
window.geometry=()=>{const rect=id=>document.getElementById(id).getBoundingClientRect().toJSON();return {a:rect('trigger'),s:rect('sub-menu'),viewport:{w:innerWidth,h:innerHeight},style:document.getElementById('sub-overlay').getAttribute('style')};};
</script>
