\* One worker's process and the words sent to it (claude-workers.ts): six words, two background tasks at once.
\* Run: spec/tools/tlc.sh spec/models/worker/WorkerProcess.tla
CONSTANTS
  MaxWords = 6
  MaxBg = 2
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK WordsAccounted NoWordLost HeldHasWords HeldOnlyWhileEnding ExitedIsChecked WorkingIsOpen IdleHasTimer OneProcess
PROPERTIES NoSleepWithBackground HeldFailsOnlyForLeftovers HeldIsTaken WordsSettle
