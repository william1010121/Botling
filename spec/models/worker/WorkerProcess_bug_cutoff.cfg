\* Bug switch: Bug = "cutoff" puts back claude-workers.ts before 0ea2a290: the timer of a report kept for a Monitor let
\* the report go whatever was under way. The Monitor ends, its event wakes the model, and the wake turn outlasts the
\* grace: the run ended with the first turn's report and the wake turn's words went nowhere (its result came with no
\* run). TLC must find TurnNotCutOff violated.
\* Run: spec/tools/tlc.sh spec/models/worker/WorkerProcess.tla -config WorkerProcess_bug_cutoff.cfg
CONSTANTS
  MaxWords = 1
  MaxBg = 1
  MaxWakes = 1
  Bug = "cutoff"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneReportPerRun TextsAccounted
PROPERTIES TurnNotCutOff
