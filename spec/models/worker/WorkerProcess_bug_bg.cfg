\* Bug switch: Bug = "bg" keeps the held words of 95fcab3a but leaves out its background rule: the keep-alive closes the
\* input while a background command it started minutes ago still runs (the next run then waits for that command).
\* TLC must find NoSleepWithBackground violated.
\* Run: spec/tools/tlc.sh spec/models/worker/WorkerProcess.tla -config WorkerProcess_bug_bg.cfg
CONSTANTS
  MaxWords = 2
  MaxBg = 1
  Bug = "bg"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK WordsAccounted NoWordLost
PROPERTIES NoSleepWithBackground
