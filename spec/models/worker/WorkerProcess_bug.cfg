\* Bug switch: Bug = "sleep" puts back the app before 95fcab3a: the keep-alive closed a worker's input 10 minutes after
\* its result whatever it left running in the background, and the next run and its steers were written into whatever
\* process was there, closed input or not (the page said Running; the words were gone). TLC must find NoWordLost violated.
\* Run: spec/tools/tlc.sh spec/models/worker/WorkerProcess.tla -config WorkerProcess_bug.cfg
CONSTANTS
  MaxWords = 2
  MaxBg = 1
  Bug = "sleep"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK WordsAccounted NoWordLost
PROPERTIES NoSleepWithBackground
