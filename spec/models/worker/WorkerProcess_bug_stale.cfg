\* Bug switch: Bug = "stale" puts back claude-workers.ts before this model's fix: any exit's tree check, however late,
\* took a held run. An earlier process exits mid-run, a new one takes the session, finishes its run and is closing when
\* the next run comes (held); the first process's check then answers and its spawn is refused (the closing process is
\* still alive): the run fails with "earlier process is still ending" although nothing was left behind.
\* TLC must find HeldFailsOnlyForLeftovers violated.
\* Run: spec/tools/tlc.sh spec/models/worker/WorkerProcess.tla -config WorkerProcess_bug_stale.cfg
CONSTANTS
  MaxWords = 3
  MaxBg = 0
  Bug = "stale"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK WordsAccounted NoWordLost
PROPERTIES HeldFailsOnlyForLeftovers
