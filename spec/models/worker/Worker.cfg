\* Two workers, two runs each, one crash, the coordinator policy of Claude workers (Ack "none"): about 25 s.
\* Worker_checkpoint.cfg checks the checkpoint policy (Codex, Antigravity) on one worker.
\* Run: spec/tools/tlc.sh spec/models/worker/Worker.tla
CONSTANTS
  Workers = {w1, w2}
  MaxRun = 2
  MaxCrash = 1
  Ack = "none"
  StaleQueuedOps = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneLiveRun StaleIsGuarded OwedOnlyEnded NoFalseFailed
PROPERTIES OneTerminal NoStaleOp ReportAtMostOnce RunEnds ReportSettles QueueDrains
