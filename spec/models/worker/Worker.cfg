\* Two workers, two runs each, one crash, the coordinator policy of Claude workers (Ack "none"): about 2 min.
\* Worker_followup*.cfg check notes and the follow-up route of a worker started for another bot's @.
\* Worker_checkpoint.cfg checks the checkpoint policy (Codex, Antigravity) on one worker.
\* Run: spec/tools/tlc.sh spec/models/worker/Worker.tla
CONSTANTS
  Workers = {w1, w2}
  MaxRun = 2
  MaxCrash = 1
  Ack = "none"
  StaleQueuedOps = FALSE
  FollowUp = FALSE
  MaxNotes = 0
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneLiveRun StaleIsGuarded OwedOnlyEnded NoFalseFailed DueIsPending TurnsOnLiveRoute FollowUpOnce
PROPERTIES OneTerminal NoStaleOp ReportAtMostOnce NoStaleSteer RunEnds ReportSettles QueueDrains
