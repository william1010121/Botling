\* Bug switch: Bug = "monexit" leaves out the process's end sending a report kept for a Monitor (claude-workers.ts
\* onExit): the turn ended well, its report waited for the Monitor, the process ended (a crash, a kill), and the run
\* ended "exited before its report" with the words the turn had said dropped. TLC must find KeptIsReported violated.
\* Run: spec/tools/tlc.sh spec/models/worker/WorkerProcess.tla -config WorkerProcess_bug_monexit.cfg
CONSTANTS
  MaxWords = 1
  MaxBg = 1
  MaxWakes = 0
  Bug = "monexit"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneReportPerRun TextsAccounted
PROPERTIES KeptIsReported
