\* Bug switch: StaleQueuedOps = TRUE puts back the race fixed in 3910341f ("stale queued operations refused"): a stop or
\* cancel that waited for the worker's operation (here a recovery that starts the next run) acted on whatever run was
\* current when it got the worker. TLC must find NoStaleOp violated.
\* Run: spec/tools/tlc.sh spec/models/worker/Worker.tla -config Worker_bug.cfg
CONSTANTS
  Workers = {w1, w2}
  MaxRun = 2
  MaxCrash = 1
  Ack = "none"
  StaleQueuedOps = TRUE
  FollowUp = FALSE
  MaxNotes = 0
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneLiveRun StaleIsGuarded OwedOnlyEnded NoFalseFailed DueIsPending TurnsOnLiveRoute FollowUpOnce
PROPERTIES OneTerminal NoStaleOp ReportAtMostOnce
