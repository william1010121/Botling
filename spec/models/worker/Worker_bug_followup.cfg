\* Bug switch: Bug = "followup" is the app before this model's fix: the coordinator's turn on the report of a worker it
\* started for another bot's @ was posted back only when it ended with words; a turn that failed, was stopped or showed
\* nothing told the asking bot nothing, so it never heard the run had ended. TLC must find OwedEndsByPost violated.
\* Run: spec/tools/tlc.sh spec/models/worker/Worker.tla -config Worker_bug_followup.cfg
CONSTANTS
  Workers = {w1}
  MaxRun = 1
  MaxCrash = 0
  Ack = "none"
  StaleQueuedOps = FALSE
  FollowUp = TRUE
  MaxNotes = 0
  Bug = "followup"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES OwedEndsByPost
