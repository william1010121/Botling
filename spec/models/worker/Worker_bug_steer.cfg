\* Bug switch: Bug = "steer" puts back what eae248aa fixed: a steer reply that came back late ("no active turn") acted on
\* whatever run was current, starting a run with an earlier run's words and dropping that run's pending report.
\* TLC must find NoStaleSteer violated.
\* Run: spec/tools/tlc.sh spec/models/worker/Worker.tla -config Worker_bug_steer.cfg
CONSTANTS
  Workers = {w1}
  MaxRun = 3
  MaxCrash = 0
  Ack = "none"
  StaleQueuedOps = FALSE
  FollowUp = FALSE
  MaxNotes = 0
  Bug = "steer"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES NoStaleSteer
