\* Notes (app_notify_owner) and the follow-up route of a worker started for another bot's @: one worker, two runs,
\* one crash, one note, the route linked, expired, moved with the worker. Claude coordinators (Ack "none").
\* Run: spec/tools/tlc.sh spec/models/worker/Worker.tla -config Worker_followup.cfg
CONSTANTS
  Workers = {w1}
  MaxRun = 2
  MaxCrash = 1
  Ack = "none"
  StaleQueuedOps = FALSE
  FollowUp = TRUE
  MaxNotes = 1
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneLiveRun StaleIsGuarded OwedOnlyEnded NoFalseFailed DueIsPending TurnsOnLiveRoute FollowUpOnce
PROPERTIES OneTerminal NoStaleOp ReportAtMostOnce NoStaleSteer NoteToOwner PostOncePerTurn OwedEndsByPost RunEnds ReportSettles QueueDrains FollowUpArrives
