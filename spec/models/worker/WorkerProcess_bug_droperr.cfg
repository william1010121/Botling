\* Bug switch: Bug = "droperr" puts back claude-workers.ts before monitor-fix2: a turn's good report waited for its
\* Monitor, the Monitor's event woke the model, and that wake turn failed (an API error, a too-long prompt): the run
\* ended with the error alone and the report it had kept was gone. An API error that passes did the same over its
\* retry. TLC must find KeptIsReported or DroppedOnlyCutOff violated.
\* Run: spec/tools/tlc.sh spec/models/worker/WorkerProcess.tla -config WorkerProcess_bug_droperr.cfg
CONSTANTS
  MaxWords = 1
  MaxBg = 1
  MaxWakes = 1
  Bug = "droperr"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneReportPerRun TextsAccounted
PROPERTIES KeptIsReported DroppedOnlyCutOff
