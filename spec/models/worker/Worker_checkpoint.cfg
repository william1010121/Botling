\* The checkpoint policy (Codex, Antigravity coordinators): queued report turns, uncertain hand-overs, a second attempt,
\* unresolved. One worker (two take about 5 minutes: 1.18M states, no error on 2026-11-02).
\* Run: spec/tools/tlc.sh spec/models/worker/Worker.tla -config Worker_checkpoint.cfg
CONSTANTS
  Workers = {w1}
  MaxRun = 2
  MaxCrash = 1
  Ack = "checkpoint"
  StaleQueuedOps = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneLiveRun StaleIsGuarded OwedOnlyEnded NoFalseFailed
PROPERTIES OneTerminal NoStaleOp ReportAtMostOnce RunEnds ReportSettles QueueDrains
