\* Three bots, C with a sub bot S; at most 2 @s per behaviour, a cap of 1 per user line (the app has 3) so it is reached.
CONSTANTS
  Top = {"A", "B", "C"}
  Sub = {"S"}
  Parent <- ParentMC
  Bodies = {1}
  MaxDepth = 2
  Cap = 1
  MaxAts = 2
  MaxOwn = 1
