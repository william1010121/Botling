\* Three bots, C with a sub bot S; at most 2 @s per behaviour: a hand-back chain to the depth limit fits; no cap per user line.
CONSTANTS
  Top = {"A", "B", "C"}
  Sub = {"S"}
  Parent <- ParentMC
  Bodies = {1}
  MaxDepth = 2
  MaxAts = 2
  MaxOwn = 1
  BUG = "none"
SPECIFICATION Spec
INVARIANTS TypeOK OneSpeaker OneTurnEach NoSilentDrop DeliveredOnce HopBound WakeOnce WakeBelowDepth SubReachable SubOnlyInParent OwedAtLastLevel PendingExact
PROPERTIES CallInEnds PendingEmpties CallerHearsBack NoRoundWithoutUser LastLevelSpends
