\* Two project bots, C with the sub bots S and T (siblings), A with U; at most 2 @s per behaviour: a hand-back chain to the depth limit fits; no cap per user line.
CONSTANTS
  Top = {"A", "C"}
  Sub = {"S", "T", "U"}
  Parent <- ParentMC
  Bodies = {1}
  MaxDepth = 2
  MaxAts = 2
  MaxOwn = 1
  BUG = "none"
SPECIFICATION Spec
INVARIANTS TypeOK OneSpeaker OneTurnEach NoSilentDrop DeliveredOnce HopBound WakeOnce WakeBelowDepth Reachable SubOnlyInKin OwedAtLastLevel PendingExact
PROPERTIES CallInEnds PendingEmpties CallerHearsBack NoRoundWithoutUser LastLevelSpends
