SPECIFICATION Spec
INVARIANTS TypeOK OneSpeaker OneTurnEach NoSilentDrop DeliveredOnce HopBound SubReachable SubOnlyInParent CapPerUserLine PendingExact
PROPERTIES CallInEnds PendingEmpties
