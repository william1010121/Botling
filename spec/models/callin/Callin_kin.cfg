\* Callin.cfg plus A's sub bot U, so a sub bot's @ to another bot's sub bot (its cousin) is checked too; too big for CI,
\* safety only (run by hand: spec/tools/tlc.sh with -config Callin_kin.cfg); at most 2 @s per behaviour: a hand-back chain to the depth limit fits; no cap per user line.
CONSTANTS
  Top = {"A", "C"}
  Sub = {"S", "T", "U"}
  Parent <- ParentMC
  Bodies = {1}
  MaxDepth = 2
  MaxAts = 2
  MaxOwn = 1
  BUG = "none"
SPECIFICATION Spec
INVARIANTS TypeOK OneSpeaker OneTurnEach NoSilentDrop DeliveredOnce HopBound WakeOnce WakeBelowDepth Reachable SubOnlyInKin OwedAtLastLevel PendingExact
