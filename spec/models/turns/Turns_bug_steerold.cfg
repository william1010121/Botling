\* routeTurn queued only for a model change: after a move your line was steered (or paused into) the process still
\* in the old folder. TLC must find StaleSend violated.
CONSTANTS
  Users = {u1}
  Apps = {a1}
  Conducted = {a1}
  Engine = "claude"
  MaxMoves = 1
  MaxWork = 1
  MaxSwaps = 0
  Bug = "steerold"
SPECIFICATION Spec
INVARIANTS TypeOK ReadOnce StaleSend PausedNotYours QueueWaits DeferredBehind
CHECK_DEADLOCK FALSE
