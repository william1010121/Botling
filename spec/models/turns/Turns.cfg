\* A line of yours and a handed-over wake-up of the app's on claude's head; one move, one piece of its own work.
\* (Two lines of yours, or a swap, take TLC minutes; Turns_bug_*.cfg add them where a bug needs them.)
CONSTANTS
  Users = {u1}
  Apps = {a1}
  Conducted = {a1}
  Engine = "claude"
  MaxMoves = 1
  MaxWork = 1
  MaxSwaps = 0
  Bug = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ReadOnce StaleSend PausedNotYours QueueWaits DeferredBehind
PROPERTIES StoppedNeverStarts TurnEnds QueueDrains HoldEnds EveryMessageRead
CHECK_DEADLOCK FALSE
