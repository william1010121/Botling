\* next() while a stopped turn drained (a swap called off) brought back the turn set aside: it took the stopped
\* turn's tail for its own, and claude had read its line already. TLC must find TurnEnds violated.
CONSTANTS
  Users = {u1}
  Apps = {a1}
  Conducted = {a1}
  Engine = "claude"
  MaxMoves = 1
  MaxWork = 1
  MaxSwaps = 1
  Bug = "drainnext"
SPECIFICATION Spec
INVARIANTS TypeOK ReadOnce StaleSend PausedNotYours QueueWaits DeferredBehind
PROPERTIES TurnEnds
CHECK_DEADLOCK FALSE
