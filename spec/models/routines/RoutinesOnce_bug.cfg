\* The one-shot line dispatched before it is taken out: a crash in between leaves it in the file and the
\* next check runs it again. TLC must find RemovedBeforeRun (then OnceLineRunsOnce) violated.
CONSTANTS
  Jobs = {j1}
  Bots = {p}
  Requests = {r1}
  MaxTime = 1
  Cron = {1}
  Lines = {o1, o2}
  OnceBug = "dispatch-first"
  Bug = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOncePerDue OnceFiresOnce OneSchedulePerRequest BrokenIsTold OnceLineRunsOnce RemovedBeforeRun RunMeansDispatched
PROPERTIES InactiveNeverFires BrokenKeepsJobs NoLineInFileIsLost LostOnlyToReplacedFile DueIsHandled BrokenIsToldEventually OnceLineIsTaken
CHECK_DEADLOCK FALSE
