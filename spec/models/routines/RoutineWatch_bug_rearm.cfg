\* Bug switch: Bug = "rearm": a pass does not re-arm the watch (the cooldown counts from the last wake whatever passed
\* since), so a failure right after a pass waits out the cooldown. TLC must find FirstFailureWakes violated.
\* Run: spec/tools/tlc.sh spec/models/routines/RoutineWatch.tla -config RoutineWatch_bug_rearm.cfg
CONSTANTS
  MaxTime = 3
  Rewake = 3
  MaxCrash = 0
  Bug = "rearm"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES FirstFailureWakes
