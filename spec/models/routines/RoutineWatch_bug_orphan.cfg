\* Bug switch: Bug = "orphan" is the app before this model's fix: a watch's command was not in the process ledger, so
\* when the app died it ran on (a hung check with no 120 s limit any more), and the next start's check started the
\* watch again beside it. TLC must find NoOverlap violated.
\* Run: spec/tools/tlc.sh spec/models/routines/RoutineWatch.tla -config RoutineWatch_bug_orphan.cfg
CONSTANTS
  MaxTime = 2
  Rewake = 3
  MaxCrash = 1
  Bug = "orphan"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoOverlap
