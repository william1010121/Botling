\* c0154c79: the startup read of the routines counts as the clock having told a broken file, so a
\* file broken while the app was closed is never said in the chat. TLC must find BrokenIsTold violated.
CONSTANTS
  Jobs = {j1, j2}
  Bots = {p}
  Requests = {r1}
  MaxTime = 2
  Cron = {1, 2}
  Lines = {}
  OnceBug = "none"
  Bug = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOncePerDue OnceFiresOnce OneSchedulePerRequest BrokenIsTold OnceLineRunsOnce RemovedBeforeRun RunMeansDispatched
PROPERTIES InactiveNeverFires NoLineInFileIsLost LostOnlyToReplacedFile BrokenKeepsJobs DueIsHandled BrokenIsToldEventually OnceLineIsTaken
CHECK_DEADLOCK FALSE
