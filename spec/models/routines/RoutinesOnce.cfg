\* One-shot lines: one bot, two lines (the second may be the same line appended again), one legacy job
\* slot (a line a rewrite can lose too), one request id; minutes 0..1, five-field jobs run at minute 1.
CONSTANTS
  Jobs = {j1}
  Bots = {p}
  Requests = {r1}
  MaxTime = 1
  Cron = {1}
  Lines = {o1, o2}
  OnceBug = "none"
  Bug = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOncePerDue OnceFiresOnce OneSchedulePerRequest BrokenIsTold OnceLineRunsOnce RemovedBeforeRun RunMeansDispatched
PROPERTIES InactiveNeverFires BrokenKeepsJobs NoLineInFileIsLost LostOnlyToReplacedFile DueIsHandled BrokenIsToldEventually OnceLineIsTaken
CHECK_DEADLOCK FALSE
