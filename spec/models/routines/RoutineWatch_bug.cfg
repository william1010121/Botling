\* Bug switch: Bug = "storm" leaves the storm rule out: every failure of a watch that keeps failing wakes the bot.
\* TLC must find QuietInCooldown violated.
\* Run: spec/tools/tlc.sh spec/models/routines/RoutineWatch.tla -config RoutineWatch_bug.cfg
CONSTANTS
  MaxTime = 3
  Rewake = 3
  MaxCrash = 0
  Bug = "storm"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES QuietInCooldown
