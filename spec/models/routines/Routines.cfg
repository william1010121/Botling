\* 2 job slots, a project bot and its sub bot, one request id (a second create with it is a retry),
\* minutes 0..2, recurring and legacy jobs run at minutes 1 and 2.
CONSTANTS
  Jobs = {j1, j2}
  Bots = {p}
  Requests = {r1}
  MaxTime = 2
  Cron = {1, 2}
  Bug = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOncePerDue OnceFiresOnce OneSchedulePerRequest BrokenIsTold
PROPERTIES InactiveNeverFires BrokenKeepsJobs DueIsHandled BrokenIsToldEventually
CHECK_DEADLOCK FALSE
