\* The core keeps answering a failed plugin's folders (folderProviders without its enabled check, so the
\* third crash does not invalidate them): a bot starts a turn in a worktree nobody keeps any more.
\* TLC must find TurnNotDisabled violated.
CONSTANTS
  Folders = {w1}
  P = proj
  None = none
  MaxUses = 1
  MaxBoots = 0
  MaxEnables = 0
  Bug = "noinvalidate"
SPECIFICATION Spec
INVARIANTS TypeOK CacheFromPlugin DiskFromPlugin ToldIsAnswer PendingOnlyAwake HeldOnlyForRestart AsleepIsQuiet RestartBeforeTurn
PROPERTIES TurnStartsCurrent TurnNotDisabled TurnFromPlugin RestartOnlyOwed OwedOnlyOnMove Converges HeldGoes
CHECK_DEADLOCK FALSE
