\* Bug switch: the design before d678d161 ("Restart: one failed shutdown no longer pauses every bot's
\* continuation"): one participant's failed shutdown left the journal "preparing", so every bot was held back.
\* TLC must FAIL on Continues. (OthersNeverBlock catches it too; it is left out here to show the liveness failure.)
CONSTANTS
  Bots = {b1, b2}
  Plugins = plugins
  MaxCrashes = 0
  BUG = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES Continues
