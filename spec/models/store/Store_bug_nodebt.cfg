\* Bug switch: a failed flush owes nothing. The batch's commands are rejected; the sender re-sends one, the writer
\* answers it from its receipt in a batch that writes nothing and is not flushed, and a power loss takes the commit.
\* TLC must find AckedKept violated.
\* Run: spec/tools/tlc.sh spec/models/store/Store.tla -config Store_bug_nodebt.cfg
CONSTANTS
  Acks = {a1}
  Events = {e1}
  MaxFault = 1
  Bug = "nodebt"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AckedKept NoFork
