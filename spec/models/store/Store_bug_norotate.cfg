\* Bug switch: no boot check. A power loss takes entries a reader already got; the next run commits others under the
\* same seqs before the reader comes back, and the reader follows from its cursor. TLC must find NoFork violated.
\* Run: spec/tools/tlc.sh spec/models/store/Store.tla -config Store_bug_norotate.cfg
CONSTANTS
  Acks = {a1}
  Events = {e1, e2}
  MaxFault = 1
  Bug = "norotate"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AckedKept NoFork
