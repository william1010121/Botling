\* Bug switch: acknowledge right after COMMIT, without the flush (synchronous = NORMAL with no durability marks).
\* A power loss then takes an acknowledged command. TLC must find AckedKept violated.
\* Run: spec/tools/tlc.sh spec/models/store/Store.tla -config Store_bug_noflush.cfg
CONSTANTS
  Acks = {a1}
  Events = {e1}
  MaxFault = 1
  Bug = "noflush"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AckedKept NoFork
