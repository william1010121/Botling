\* Bug switch: a naive takeover (read the lock; when it is free or stale, write ours over whatever is there).
\* Two cores that both found the lock stale both write. TLC must find OneWriter violated.
\* Run: spec/tools/tlc.sh spec/models/datalock/DataLock.tla -config DataLock_bug.cfg
CONSTANTS
  Cores = {c1, c2, c3}
  None = None
  MaxSwap = 0
  Bug = "naive"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneWriter
