\* Bug switch: the takeover 7be956c7 shipped. A stale lock was renamed aside, checked, and linked back when it
\* turned out to be a fresh one another core had just taken; between the rename and the link the name is free and
\* a fourth core takes it. The core whose lock was moved keeps writing beside it until its next self-check.
\* TLC must find OneWriter violated (HoldsLock fails a step earlier: the moved lock is missing while its core writes).
\* Run: spec/tools/tlc.sh spec/models/datalock/DataLock.tla -config DataLock_bug_restore.cfg
CONSTANTS
  Cores = {c1, c2, c3, c4}
  None = None
  MaxSwap = 0
  Bug = "restore"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneWriter
