\* The code at c1b17be2, app_send_message only: it is not checked, so a plugin's turn gives the bot's own worker a new run
\* with the bot's rights. TLC finds NoAmplification violated. Fix: under a mark, app_send_message only to that plugin's
\* own worker, while it is granted.
\* Run: spec/tools/tlc.sh spec/models/heard/OrchestrationHeard.tla -config OrchestrationHeard_today_message.cfg
CONSTANTS
  Plugins = {pa, pb}
  Shipped = {ps}
  Workers = {w1, w2}
  MaxMsgs = 3
  MaxRuns = 3
  MaxChanges = 1
  Granted0 = {pb}
  Mark = "turn"
  GateMessage = FALSE
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES NoAmplification
