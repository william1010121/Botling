\* A plugin installed from the catalog (not written by a bot: no card), with the three fixes; no restart (Orchestration.cfg
\* has it); otherwise as Orchestration.cfg.
\* Run: spec/tools/tlc.sh spec/models/orchestration/OrchestrationCatalog.tla
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 2
  MaxCrash = 0
  MaxChanges = 1
  Written = {}
  Code = "fixed"
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneOwner Traceable FewerRights BotToldOnce PluginToldOnce EndOwesBot AtOnceHolds PlacesHold PerDayHolds PlacesAreReal
PROPERTIES OwnerFixed GrantBound HearsOnlyItsOwn BotNotSkipped BotGetsReport EndReachesPlugin OwedSettles
