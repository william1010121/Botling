\* The code at c1b17be2: a cancel under way when the app goes away leaves `stopped` true on an open row; after the
\* restart pickUp and ended() skip it, so the place is held for ever and the run is never told.
\* TLC finds PlacesAreReal violated. Fix: when the book is loaded, `stopped` is cleared on open rows.
\* Run: spec/tools/tlc.sh spec/models/orchestration/Orchestration.tla -config Orchestration_today_stopped.cfg
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 2
  MaxCrash = 1
  MaxChanges = 1
  Written = {p1}
  Code = "today"
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PlacesAreReal
