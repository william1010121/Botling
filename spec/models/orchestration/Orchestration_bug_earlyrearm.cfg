\* The warning re-armed in the gate (before a card's wait), not when the card's answer takes the place: a count that
\* dipped under the threshold while the card waited is crossed again with no notice. AtOnce = 0 so two workers show it.
\* TLC must find WarnsEachCrossing violated.
\* Run: spec/tools/tlc.sh spec/models/orchestration/Orchestration.tla -config Orchestration_bug_earlyrearm.cfg
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 0
  PerDay = 2
  MaxCrash = 1
  MaxChanges = 1
  Written = {p1}
  Code = "fixed"
  Bug = "earlyrearm"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES WarnsEachCrossing
