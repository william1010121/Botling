\* A host's registration does no pickUp: a run cut off by a restart is never told while the plugin starts nothing.
\* TLC must find EndReachesPlugin violated.
\* Run: spec/tools/tlc.sh spec/models/orchestration/Orchestration.tla -config Orchestration_bug_nopickup.cfg
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 1
  MaxCrash = 1
  MaxChanges = 1
  Written = {p1}
  Code = "fixed"
  Bug = "nopickup"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES EndReachesPlugin
