\* As Orchestration.cfg with one plugin change (disable, enable, replace, revoke or grant) and no restart.
\* Run: spec/tools/tlc.sh spec/models/orchestration/OrchestrationChange.tla
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 1
  MaxCrash = 0
  MaxChanges = 1
  Written = {p1}
  Code = "fixed"
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneOwner Traceable FewerRights BotToldOnce PluginToldOnce EndOwesBot RunningCounted DayCounted WarnsOnlyPast PlacesAreReal
PROPERTIES OwnerFixed GrantBound HearsOnlyItsOwn BotNotSkipped WarnsEachCrossing BotGetsReport EndReachesPlugin OwedSettles
