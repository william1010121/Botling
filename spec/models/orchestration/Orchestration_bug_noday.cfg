\* The day's count leaves out a row a restart cut off (a reservation whose task id was not written; the book keeps it
\* as a row that counts for the day, plugin-workers.ts constructor). TLC must find DayCounted violated.
\* Run: spec/tools/tlc.sh spec/models/orchestration/Orchestration.tla -config Orchestration_bug_noday.cfg
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 1
  MaxCrash = 1
  MaxChanges = 1
  Written = {p1}
  Code = "fixed"
  Bug = "noday"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK DayCounted
