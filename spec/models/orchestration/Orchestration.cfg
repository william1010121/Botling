\* Workers a plugin starts, with the three fixes (Code = "fixed"): one plugin a bot wrote (cards), two hashes, two
\* workers, two runs, one restart, no plugin change (OrchestrationChange.cfg has one, Orchestration_full.cfg both).
\* Run: spec/tools/tlc.sh spec/models/orchestration/Orchestration.tla
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 1
  MaxCrash = 1
  MaxChanges = 0
  Written = {p1}
  Code = "fixed"
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneOwner Traceable FewerRights BotToldOnce PluginToldOnce EndOwesBot RunningCounted DayCounted WarnsOnlyPast PlacesAreReal
PROPERTIES OwnerFixed GrantBound HearsOnlyItsOwn BotNotSkipped WarnsEachCrossing BotGetsReport EndReachesPlugin OwedSettles
