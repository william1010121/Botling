\* The long run: two plugin changes (about 1.15 million states, 5 min with 12 workers on the Linux host).
\* Run: spec/tools/tlc.sh spec/models/orchestration/Orchestration.tla -config Orchestration_full.cfg
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 2
  MaxCrash = 1
  MaxChanges = 2
  Written = {p1}
  Code = "fixed"
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneOwner Traceable FewerRights BotToldOnce PluginToldOnce EndOwesBot AtOnceHolds PlacesHold PerDayHolds PlacesAreReal
PROPERTIES OwnerFixed GrantBound HearsOnlyItsOwn BotNotSkipped BotGetsReport EndReachesPlugin OwedSettles
