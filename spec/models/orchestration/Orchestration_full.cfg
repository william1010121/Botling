\* The long run: a restart and a plugin change together (888,901 distinct states, 4 min 50 s with 16 workers on the
\* Linux host; with no cap two workers run at once, so two changes are no longer the long run's size).
\* Run: spec/tools/tlc.sh spec/models/orchestration/Orchestration.tla -config Orchestration_full.cfg
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 1
  MaxCrash = 1
  MaxChanges = 1
  Written = {p1}
  Code = "fixed"
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneOwner Traceable FewerRights BotToldOnce PluginToldOnce EndOwesBot RunningCounted DayCounted WarnsOnlyPast PlacesAreReal
