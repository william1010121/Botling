\* The hash never compared (not in `reconcile()`, `mayHear()` or `mine()`): after a replace the new code hears the old
\* code's worker. (Either compare alone is enough: reconcile hands the entry back, mayHear then refuses it.)
\* TLC must find HearsOnlyItsOwn violated.
\* Run: spec/tools/tlc.sh spec/models/orchestration/Orchestration.tla -config Orchestration_bug_nohash.cfg
CONSTANTS
  Plugins = {p1}
  Hashes = {h1, h2}
  Workers = {w1, w2}
  MaxRun = 2
  AtOnce = 1
  PerDay = 1
  MaxCrash = 1
  MaxChanges = 1
  Written = {p1}
  Code = "fixed"
  Bug = "nohash"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES HearsOnlyItsOwn
