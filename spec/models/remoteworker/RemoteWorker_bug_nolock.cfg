\* Bug switch: attach and start do not take the session lock: the resumed claude runs beside the old one, which the agent
\* has not stopped yet. TLC must find OneProc violated.
CONSTANTS
  Paths = {"ssh"}
  MaxConns = 3
  MaxReqs = 1
  MaxOut = 0
  MaxTries = 2
  MaxPairs = 1
  Bug = "nolock"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneProc AnsweredOnce OpenNotApplied SettledIsApplied InSequence RevokeEnds SameVersion RunningIsUp
