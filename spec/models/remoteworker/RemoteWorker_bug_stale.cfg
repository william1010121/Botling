\* Bug switch: the agent applies an answer from any connection: the answer given before the disconnect lands on the
\* resumed run's request while its card is open again. TLC must find OpenNotApplied violated.
CONSTANTS
  Paths = {"ssh"}
  MaxConns = 3
  MaxReqs = 1
  MaxOut = 0
  MaxTries = 2
  MaxPairs = 1
  Bug = "stale"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneProc AnsweredOnce OpenNotApplied SettledIsApplied InSequence RevokeEnds SameVersion RunningIsUp
