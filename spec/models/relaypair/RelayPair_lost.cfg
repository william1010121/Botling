\* Known limitation, not a switch: `paired` has no acknowledgement. The connection drops after Confirm marked the
\* code used (or after Grant sent `paired`, before it arrived): the code is spent and the phone holds no token;
\* scanning it again gets nope ('offer'), and relay-devices.json keeps a device nobody can use until it expires.
\* TLC must find CodeReachesPhone violated: Make, JoinPair p1, Take, HsCheck, HsKeys, Recv (the phone sends
\* {t:'pair'}), Drop, Take, Confirm (the frame was already forwarded: the code is spent), Grant (`paired` lost).
\* Fixing it needs an acknowledgement from the phone (or undoing a pairing whose phone never sent a frame after
\* `paired`): a protocol decision, not taken here.
\* Run: spec/tools/tlc.sh spec/models/relaypair/RelayPair.tla -config RelayPair_lost.cfg
CONSTANTS
  Conns = {p1, p2}
  Offers = {o1}
  None = None
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK CodeReachesPhone
