\* Known limitation, as RelayPair_lost.cfg: the code leaves the list before the token is issued and answered, so a
\* core that dies in between, or an answer lost on the way, spends the code and the phone holds no token (scanning
\* it again is "invalid"). TLC must find CodeReachesPhone violated.
\* Run: spec/tools/tlc.sh spec/models/relaypair/LanPair.tla -config LanPair_lost.cfg
CONSTANTS
  Procs = {q1, q2}
  Phones = {a, b}
  Codes = {s1}
  None = None
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK CodeReachesPhone
