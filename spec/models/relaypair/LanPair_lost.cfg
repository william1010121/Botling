\* The phone acknowledges its token: until then the code stays listed, held for that phone, and the phone's record
\* expires at the ack deadline. A core that dies after Take, or an answer lost on the way, leaves a held code
\* whose deadline passes and a record that expires with it; the next Take gives the code back. Once the
\* limitation of the store before the ack (LanPair_noack.cfg), now a property: TLC passes. LanPair.cfg checks
\* it too, with the rest.
\* Run: spec/tools/tlc.sh spec/models/relaypair/LanPair.tla -config LanPair_lost.cfg
CONSTANTS
  Procs = {q1, q2}
  Phones = {a, b}
  Codes = {s1}
  None = None
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK CodeReachesPhone
