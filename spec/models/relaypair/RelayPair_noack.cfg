\* Bug switch: pairing without the phone's ack (the connector before it; still the path for a phone app that does
\* not announce v2). Confirm spends the code and stores the device before `paired` is even sent, so a connection
\* that drops in between spends the code on a phone that holds no token: scanning it again gets nope ('offer'),
\* and relay-devices.json keeps a device nobody can use until it expires.
\* TLC must find CodeReachesPhone violated: Make, JoinPair p1, Take, HsCheck, HsKeys, Recv (the phone sends
\* {t:'pair'}), Take, Confirm (the code is spent), Grant, Drop (`paired` is lost on the way).
\* Run: spec/tools/tlc.sh spec/models/relaypair/RelayPair.tla -config RelayPair_noack.cfg
CONSTANTS
  Conns = {p1, p2}
  Offers = {o1}
  None = None
  Bug = "noAck"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK CodeReachesPhone
