\* The design with three connections: two phones racing one code while a paired one connects again and is revoked.
\* Too slow for CI (about 16 min, 1,993,981 states); run it after changing the model or the connector.
\* Run: spec/tools/tlc.sh spec/models/relaypair/RelayPair.tla -config RelayPair_three.cfg
CONSTANTS
  Conns = {p1, p2, p3}
  Offers = {o1}
  None = None
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneDevicePerCode RevokeEnds NoUseByClosed CodeReachesPhone
PROPERTIES PairOrNope SessionAnswered HeldResolves
