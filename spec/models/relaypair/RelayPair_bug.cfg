\* Bug switch: the connector before this model (7c5bd810). Confirm resumes on a peer that was closed while its
\* frame was being opened (channel.open is awaited first): the phone's connection drops, the relay's close reaches
\* the desktop, then the {t:'pair'} frame is opened and the code is spent and the device stored for nobody.
\* TLC must find NoUseByClosed violated: Make, JoinPair p1, Take, HsCheck, HsKeys, Recv (ack, the phone sends
\* {t:'pair'}), Take, Drop, DeskClose, Confirm.
\* Run: spec/tools/tlc.sh spec/models/relaypair/RelayPair.tla -config RelayPair_bug.cfg
CONSTANTS
  Conns = {p1, p2}
  Offers = {o1}
  None = None
  Bug = "old"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneDevicePerCode RevokeEnds NoUseByClosed
