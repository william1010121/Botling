\* Bug switch: redeem without the phone's ack (the store before it; still the path for a phone that does not ask
\* for it). The code leaves the list before the token is issued and answered, so a core that dies in between,
\* or an answer lost on the way, spends the code and the phone holds no token (scanning it again is "invalid").
\* TLC must find CodeReachesPhone violated.
\* Run: spec/tools/tlc.sh spec/models/relaypair/LanPair.tla -config LanPair_noack.cfg
CONSTANTS
  Procs = {q1, q2}
  Phones = {a, b}
  Codes = {s1}
  None = None
  Bug = "noAck"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK CodeReachesPhone
