\* Bug switch: the connector before this model, two phones with one code. Nothing claims the code at the
\* handshake, so both pass it; the first spends it at Confirm, the second is then kicked at Confirm without a
\* nope, and its page says the relay could not be reached ("check the connection and scan the code again").
\* TLC must find PairOrNope violated: Make, JoinPair p1, JoinPair p2, both Take/HsCheck/HsKeys, both phones get
\* the ack and send {t:'pair'}, Confirm p1 (used), ..., Confirm p2 (kick), Recv p2 "bye": p2 lost.
\* Run: spec/tools/tlc.sh spec/models/relaypair/RelayPair.tla -config RelayPair_bug_race.cfg
CONSTANTS
  Conns = {p1, p2}
  Offers = {o1}
  None = None
  Bug = "old"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES PairOrNope
