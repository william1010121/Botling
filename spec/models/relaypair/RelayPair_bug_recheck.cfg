\* Bug switch: what the revoke window would do if Confirm did not look the device up again. A reconnecting
\* phone passes HsCheck; revoke() runs before HsKeys sets peer.deviceId, so its filter misses the peer; the
\* handshake finishes and `ready` follows. TLC must find RevokeEnds violated (the connector's look-up closes it):
\* p1 pairs (Make ... Grant, Recv paired, Take, Commit its ack), JoinSession p2 for p1, Take, HsCheck, Revoke p1, HsKeys, Recv (ack),
\* Take, Confirm, Grant: `ready` to p1 after its revoke.
\* Run: spec/tools/tlc.sh spec/models/relaypair/RelayPair.tla -config RelayPair_bug_recheck.cfg
CONSTANTS
  Conns = {p1, p2}
  Offers = {o1}
  None = None
  Bug = "noRecheck"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK RevokeEnds
