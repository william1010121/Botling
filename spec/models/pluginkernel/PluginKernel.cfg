\* CI size: three plugins (p3 needs p1 and p2; p2 and p3 contribute to slots of the others), one registration each,
\* one hot swap, one undo that throws (two registrations, LIFO: PluginKernel_case_full.cfg).
CONSTANTS
  P1 = p1  P2 = p2  P3 = p3  S1 = s1  S2 = s2  K1 = k1  K2 = k2
  MaxSwap = 1
  MaxFail = 1
  MaxRegs = 1
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoResidue NoOrphan DependencyGuard TeardownOrder
PROPERTIES ClosedUnload UnloadEnds LoadEnds
