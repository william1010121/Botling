name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
          grep -q "^## ${GITHUB_REF_NAME#v}$" CHANGELOG.md
      # Build + fast tests only: `.integration` / `.wallClock` tests skip themselves on CI.
      - name: Test
        run: |
          (cd Web && npm ci && npm test)
          swift build --build-tests
          swift test --skip-build --no-parallel
      - name: Build Botling.app
        run: scripts/make-app.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Botling $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
