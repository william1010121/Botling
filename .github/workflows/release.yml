name: Electron release candidate

# Two lines share this workflow; the `plan` job decides which from the tag (desktop/scripts/release-check.mjs):
#  - Botling 2, tag `v2.*`: macOS, Windows and Linux; the `publish` job publishes the release as Latest.
#  - Botling 3, tag `v3.x.y-v3`: macOS only, packaged with the v3 config (`npm run dist:mac:v3`, BOTLING_V3_VERSION
#    from package.json). The `-v3` suffix is the update channel: Botling 3 follows channel `v3`, and electron-updater
#    only takes a release whose tag ends in it; it reads `v3-mac.yml`. A `v3.x.y` tag without the suffix stops the run.
#    The v3 release is a pre-release, never Latest (2.x installs read the Latest release's latest-mac.yml and would
#    show an update error on a v3 one), and stays a DRAFT: publish it by hand after a look
#    (`gh release edit <tag> --draft=false --prerelease --latest=false`).
# The release job runs no full unit suite (it takes over an hour on macOS, and CI runs it on the same commit). Instead the
# `plan` job refuses a tag build unless the CI workflow's run for the tagged commit has finished with success (release-check.mjs
# --ci-green; no run, a run still going or a failed one stops it). So: push main, wait for its CI run to turn green, then push the
# tag. A tag pushed too early fails in `plan`; once CI is green, re-run the failed workflow run.
# The final `publish` job attaches the assets to the GitHub release for the tag. To publish an existing tag from a
# previous successful run without rebuilding, dispatch this workflow with `tag` and `run_id` (the build jobs are
# skipped and that run's artifacts are used).
#
# macOS is signed with a Developer ID certificate and notarized by electron-builder, from the repository secrets
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY (the .p8 text), APPLE_API_KEY_ID and APPLE_API_ISSUER. A tag build
# without them fails: an ad-hoc signed macOS build cannot update itself, so it must not become a release.
# Windows is unsigned (the first install shows SmartScreen's warning; updates work). Linux is not signed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v2.1.0 or v3.2.2-v3). Requires run_id.'
        required: false
        default: ''
      run_id:
        description: 'Successful run whose artifacts to publish instead of rebuilding.'
        required: false
        default: ''
  push:
    tags: ['v2.*', 'v3.*']

permissions:
  contents: read

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    # Which line this run builds (see the header). Runs the scripts of the ref the workflow runs from, so a dispatch
    # that publishes an old tag still has them.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      track: ${{ steps.plan.outputs.track }}
      version: ${{ steps.plan.outputs.version }}
      release_flags: ${{ steps.plan.outputs.release_flags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: CI must be green for the tagged commit (the release job runs no full unit suite)
        # A tag push only; a manual dispatch republishes an earlier run's artifacts and builds nothing. Fails closed: a failing `gh`,
        # an unreadable list, no CI run, a running one and a failed one all stop the release before anything is built.
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --limit 50 \
            --json databaseId,status,conclusion,headSha,createdAt > "$RUNNER_TEMP/ci-runs.json"
          node desktop/scripts/release-check.mjs --ci-green "$SHA" --runs "$RUNNER_TEMP/ci-runs.json"
      - id: plan
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: node desktop/scripts/release-check.mjs --print-plan "$TAG" | tee -a "$GITHUB_OUTPUT"

  candidate:
    needs: plan
    if: ${{ inputs.run_id == '' }}
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: desktop
    env:
      BOTLING_RELEASE_BUILD: '1'
      TRACK: ${{ needs.plan.outputs.track }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check stable tag and production profile
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Botling 3: a stable 3.x.y version and a v3.x.y-v3 tag (botlingDevTrial is the 2.x trial marker; the
          # v3 config packs false whatever package.json says).
          # A dev-trial build (botlingDevTrial true, like v2.0.1) keeps the "Botling 2 Dev Trial"
          # profile: only the tag is checked. A build with botlingDevTrial false is a stable
          # production release and gets the full gate.
          if [ "$TRACK" = v3 ]; then
            if [ "$REF_TYPE" = tag ]; then
              node scripts/release-check.mjs --track v3 --tag "$REF_NAME"
            else
              node scripts/release-check.mjs --track v3
            fi
          elif [ "$(node -p 'require("./package.json").botlingDevTrial === true')" = true ]; then
            echo "TRIAL_BUILD=1" >> "$GITHUB_ENV"
            VERSION=$(node -p 'require("./package.json").version')
            if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$VERSION" ]; then echo "Tag must match desktop/package.json"; exit 1; fi
          elif [ "$REF_TYPE" = tag ]; then
            node scripts/release-check.mjs --tag "$REF_NAME"
          else
            node scripts/release-check.mjs
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix ../Web
      - run: npm run test:release
      # tsc ran out of Node's default ~2 GB heap on a cold cache (exit 134, as in ci.yml; the release has no .cache/tsc).
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run test:reports
      - run: npx playwright-core install chromium-headless-shell
      - run: npm run test:web-isolation
      - name: Require signing credentials (a tag build is never ad-hoc signed)
        env:
          REF_TYPE: ${{ github.ref_type }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "SIGNED_BUILD=1" >> "$GITHUB_ENV"
            # electron-builder wants the notarization key as a file path; the secret holds its text.
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            ( umask 077; printf '%s' "$APPLE_API_KEY" > "$key" )
            echo "APPLE_API_KEY_FILE=$key" >> "$GITHUB_ENV"
          elif [ "$REF_TYPE" = tag ]; then
            echo "::error::Missing signing secrets:$missing. A tag build must be Developer ID signed and notarized."
            exit 1
          else
            echo "::warning::Missing signing secrets:$missing. This candidate is ad-hoc signed and cannot update itself."
          fi
      - name: Package macOS arm64 ZIP and DMG, and the update feed (signed and notarized when credentials are set; never publishes)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGNED_BUILD" = 1 ]; then export APPLE_API_KEY="$APPLE_API_KEY_FILE"; else unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; fi
          if [ "$TRACK" = v3 ]; then
            # package.mjs refuses a v3 release build whose BOTLING_V3_VERSION is not package.json's version.
            BOTLING_V3_VERSION=$(node -p 'require("./package.json").version') npm run dist:mac:v3
          else
            npm run dist:mac
          fi
      - name: Verify the signature, notarization and Gatekeeper on the shipped ZIP
        if: ${{ env.SIGNED_BUILD == '1' }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          rm -rf "$RUNNER_TEMP/verify" && mkdir "$RUNNER_TEMP/verify"
          if [ "$TRACK" = v3 ]; then
            ditto -x -k "dist/v3/Botling-3-$VERSION-mac-arm64.zip" "$RUNNER_TEMP/verify"
            APP="$RUNNER_TEMP/verify/Botling 3.app"
          else
            ditto -x -k "dist/Botling-2-$VERSION-mac-arm64.zip" "$RUNNER_TEMP/verify"
            APP="$RUNNER_TEMP/verify/Botling 2.app"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Developer ID Application|TeamIdentifier=FR6FXUQLQH|flags=.*runtime"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
      - name: Check the installers and the update feed
        run: |
          if [ "$TRACK" = v3 ]; then
            node scripts/release-check.mjs --track v3 --artifacts dist/v3 --platform mac
          else
            node scripts/release-check.mjs --artifacts dist --platform mac
          fi
      - name: Build the botling-agent assets from the bundle this app ships (remote workers over the relay)
        # Botling 2 only: the install script downloads from the tag `v<version>`, which a v3 tag (`v3.x.y-v3`) is not.
        # The agent's SHA-256 is the one Botling sends with each install line and upgrade, so it must be this build's
        # out/agent/botling-agent.cjs, the file inside the app.
        if: ${{ env.TRACK == 'v2' }}
        run: |
          node scripts/agent-release.mjs dist
          sh -n dist/botling-agent-install.sh
      - name: Record source and checksums
        if: ${{ env.TRACK == 'v2' }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cd dist
          FILES="Botling-2-$VERSION-mac-arm64.zip Botling-2-$VERSION-mac-arm64.dmg latest-mac.yml botling-agent-$VERSION.cjs botling-agent-install.sh"
          shasum -a 256 $FILES > SHA256SUMS.txt
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: ${{ env.TRACK == 'v2' }}
        with:
          name: Botling-2-${{ env.RELEASE_VERSION }}-mac-arm64-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/Botling-2-${{ env.RELEASE_VERSION }}-mac-arm64.zip
            desktop/dist/latest-mac.yml
            desktop/dist/Botling-2-${{ env.RELEASE_VERSION }}-mac-arm64.dmg
            desktop/dist/SHA256SUMS.txt
            desktop/dist/SOURCE_COMMIT.txt
            desktop/dist/botling-agent-${{ env.RELEASE_VERSION }}.cjs
            desktop/dist/botling-agent-install.sh
            desktop/dist/SHA256SUMS-agent.txt
      - name: Record source and checksums (Botling 3)
        if: ${{ env.TRACK == 'v3' }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git rev-parse HEAD > dist/v3/SOURCE_COMMIT.txt
          cd dist/v3
          shasum -a 256 "Botling-3-$VERSION-mac-arm64.zip" "Botling-3-$VERSION-mac-arm64.dmg" v3-mac.yml > SHA256SUMS.txt
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: ${{ env.TRACK == 'v3' }}
        with:
          name: Botling-3-${{ env.RELEASE_VERSION }}-mac-arm64-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/v3/Botling-3-${{ env.RELEASE_VERSION }}-mac-arm64.zip
            desktop/dist/v3/Botling-3-${{ env.RELEASE_VERSION }}-mac-arm64.dmg
            desktop/dist/v3/v3-mac.yml
            desktop/dist/v3/SHA256SUMS.txt
            desktop/dist/v3/SOURCE_COMMIT.txt

  windows:
    needs: plan
    if: ${{ inputs.run_id == '' && needs.plan.outputs.track == 'v2' }}
    # Windows x64: NSIS installer (updates itself through electron-updater). Unsigned. Not run on real hardware.
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      BOTLING_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix ../Web
      # tsc ran out of Node's default ~2 GB heap on a cold cache (exit 134, as in ci.yml; the release has no .cache/tsc).
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Package Windows installer and the update feed (never publishes)
        run: npm run dist:win
      - name: Check the installer and the update feed
        shell: bash
        run: node scripts/release-check.mjs --artifacts dist --platform win
      - name: Record source and checksums
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git rev-parse HEAD > dist/SOURCE_COMMIT-win.txt
          cd dist
          sha256sum *.exe latest.yml > SHA256SUMS-win.txt
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Botling-2-${{ env.RELEASE_VERSION }}-win-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/SHA256SUMS-win.txt
            desktop/dist/SOURCE_COMMIT-win.txt

  linux:
    needs: plan
    if: ${{ inputs.run_id == '' && needs.plan.outputs.track == 'v2' }}
    # Linux: AppImage (updates itself through electron-updater) and deb (cannot; it opens the release page).
    # Unsigned. Not run on real hardware.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      BOTLING_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix ../Web
      # tsc ran out of Node's default ~2 GB heap on a cold cache (exit 134, as in ci.yml; the release has no .cache/tsc).
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Package Linux x64 AppImage and deb (never publishes)
        run: npm run dist:linux
      - name: Record source and checksums
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git rev-parse HEAD > dist/SOURCE_COMMIT-linux.txt
          cd dist
          ls -la
          sha256sum *.AppImage *.deb latest-linux.yml > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Botling-2-${{ env.RELEASE_VERSION }}-linux-x64-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest-linux.yml
            desktop/dist/SHA256SUMS-linux.txt
            desktop/dist/SOURCE_COMMIT-linux.txt

  publish:
    # Attaches the artifacts to the release for the tag and publishes it as Latest. Runs for a tag push, or for a
    # dispatch with tag + run_id. A plain branch dispatch only builds.
    needs: [plan, candidate, windows, linux]
    if: >-
      ${{ !cancelled() && !failure() &&
      (github.ref_type == 'tag' || (inputs.tag != '' && inputs.run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      TRACK: ${{ needs.plan.outputs.track }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_FLAGS: ${{ needs.plan.outputs.release_flags }}
      SOURCE_RUN: ${{ inputs.run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          persist-credentials: false
      - name: Download the build artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/assets"
          gh run download "$SOURCE_RUN" --dir "$RUNNER_TEMP/dl" --pattern '*-candidate'
          find "$RUNNER_TEMP/dl" -type f ! -name 'SOURCE_COMMIT*.txt' -exec mv {} "$RUNNER_TEMP/assets/" \;
          ls -la "$RUNNER_TEMP/assets"
      - name: Check the assets match the tag
        run: |
          if [ "$TRACK" = v3 ]; then
            # A v3 release carries no Windows or Linux build and no botling-agent assets, and must not carry a 2.x feed.
            FILES="Botling-3-$VERSION-mac-arm64.zip Botling-3-$VERSION-mac-arm64.dmg v3-mac.yml SHA256SUMS.txt"
            for f in latest-mac.yml latest-linux.yml latest.yml; do
              [ ! -e "$RUNNER_TEMP/assets/$f" ] || { echo "::error::A v3 release must not hold $f (2.x installs read it)"; exit 1; }
            done
          else
            FILES="Botling-2-$VERSION-mac-arm64.zip Botling-2-$VERSION-mac-arm64.dmg latest-mac.yml latest-linux.yml latest.yml botling-agent-$VERSION.cjs botling-agent-install.sh SHA256SUMS-agent.txt"
          fi
          for f in $FILES; do
            [ -f "$RUNNER_TEMP/assets/$f" ] || { echo "::error::Missing asset $f for $TAG"; exit 1; }
          done
      - name: Create or update the release and upload the assets (v2 as Latest, v3 as a pre-release draft)
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "$TRACK" = v3 ]; then
            TITLE="Botling $VERSION"
            SIGNING="The macOS (Apple silicon) build is Developer ID signed and notarized. This is Botling 3: Botling 3 installs update from it; Botling 2 is not affected."
          else
            TITLE="Botling $TAG"
            SIGNING="macOS (Apple silicon) builds are Developer ID signed and notarized. Linux and Windows builds are unsigned."
          fi
          {
            awk -v v="$VERSION" '$0 ~ "^## " v "$" {f=1; next} /^## /{f=0} f' CHANGELOG.md
            echo
            echo "Built from commit ${SHA:0:7} by the release workflow. $SIGNING"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber
          # The flags come from the plan job (release-check.mjs releaseFlags): 2.x goes public as Latest; 3.x stays a pre-release draft.
          gh release edit "$TAG" $RELEASE_FLAGS
      - name: Check a v3 release is a pre-release and not GitHub's Latest
        if: ${{ env.TRACK == 'v3' }}
        run: |
          gh release view "$TAG" --json tagName,isPrerelease,isDraft > "$RUNNER_TEMP/view.json"
          LATEST=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          node desktop/scripts/release-check.mjs --published v3 --tag "$TAG" --release "$RUNNER_TEMP/view.json" --latest-tag "$LATEST"
