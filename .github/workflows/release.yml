name: Electron 2 release candidate

# Builds the assets and, in the final `publish` job, attaches them to the GitHub release for the tag and publishes it
# as Latest. To publish an existing tag from a previous successful run without rebuilding, dispatch this workflow
# with `tag` and `run_id` (the build jobs are skipped and that run's artifacts are used).
#
# macOS is signed with a Developer ID certificate and notarized by electron-builder, from the repository secrets
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY (the .p8 text), APPLE_API_KEY_ID and APPLE_API_ISSUER. A tag build
# without them fails: an ad-hoc signed macOS build cannot update itself, so it must not become a release.
# Windows is unsigned (the first install shows SmartScreen's warning; updates work). Linux is not signed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v2.1.0). Requires run_id.'
        required: false
        default: ''
      run_id:
        description: 'Successful run whose artifacts to publish instead of rebuilding.'
        required: false
        default: ''
  push:
    tags: ['v2.*']

permissions:
  contents: read

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: ${{ inputs.run_id == '' }}
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: desktop
    env:
      BOTLING_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check stable tag and production profile
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A dev-trial build (botlingDevTrial true, like v2.0.1) keeps the "Botling 2 Dev Trial"
          # profile: only the tag is checked. A build with botlingDevTrial false is a stable
          # production release and gets the full gate.
          if [ "$(node -p 'require("./package.json").botlingDevTrial === true')" = true ]; then
            echo "TRIAL_BUILD=1" >> "$GITHUB_ENV"
            VERSION=$(node -p 'require("./package.json").version')
            if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$VERSION" ]; then echo "Tag must match desktop/package.json"; exit 1; fi
          elif [ "$REF_TYPE" = tag ]; then
            node scripts/release-check.mjs --tag "$REF_NAME"
          else
            node scripts/release-check.mjs
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix ../Web
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:reports
      - run: npx playwright-core install chromium-headless-shell
      - run: npm run test:web-isolation
      - name: Require signing credentials (a tag build is never ad-hoc signed)
        env:
          REF_TYPE: ${{ github.ref_type }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "SIGNED_BUILD=1" >> "$GITHUB_ENV"
            # electron-builder wants the notarization key as a file path; the secret holds its text.
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            ( umask 077; printf '%s' "$APPLE_API_KEY" > "$key" )
            echo "APPLE_API_KEY_FILE=$key" >> "$GITHUB_ENV"
          elif [ "$REF_TYPE" = tag ]; then
            echo "::error::Missing signing secrets:$missing. A tag build must be Developer ID signed and notarized."
            exit 1
          else
            echo "::warning::Missing signing secrets:$missing. This candidate is ad-hoc signed and cannot update itself."
          fi
      - name: Package macOS arm64 ZIP and DMG, and the update feed (signed and notarized when credentials are set; never publishes)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGNED_BUILD" = 1 ]; then export APPLE_API_KEY="$APPLE_API_KEY_FILE"; else unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; fi
          npm run dist:mac
      - name: Verify the signature, notarization and Gatekeeper on the shipped ZIP
        if: ${{ env.SIGNED_BUILD == '1' }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          rm -rf "$RUNNER_TEMP/verify" && mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "dist/Botling-2-$VERSION-mac-arm64.zip" "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/Botling 2.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Developer ID Application|TeamIdentifier=FR6FXUQLQH|flags=.*runtime"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
      - name: Check the installers and the update feed
        run: node scripts/release-check.mjs --artifacts dist --platform mac
      - name: Record source and checksums
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cd dist
          FILES="Botling-2-$VERSION-mac-arm64.zip Botling-2-$VERSION-mac-arm64.dmg latest-mac.yml"
          shasum -a 256 $FILES > SHA256SUMS.txt
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Botling-2-${{ env.RELEASE_VERSION }}-mac-arm64-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/Botling-2-${{ env.RELEASE_VERSION }}-mac-arm64.zip
            desktop/dist/latest-mac.yml
            desktop/dist/Botling-2-${{ env.RELEASE_VERSION }}-mac-arm64.dmg
            desktop/dist/SHA256SUMS.txt
            desktop/dist/SOURCE_COMMIT.txt

  windows:
    if: ${{ inputs.run_id == '' }}
    # Windows x64: NSIS installer (updates itself through electron-updater). Unsigned. Not run on real hardware.
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      BOTLING_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Package Windows installer and the update feed (never publishes)
        run: npm run dist:win
      - name: Check the installer and the update feed
        shell: bash
        run: node scripts/release-check.mjs --artifacts dist --platform win
      - name: Record source and checksums
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git rev-parse HEAD > dist/SOURCE_COMMIT-win.txt
          cd dist
          sha256sum *.exe latest.yml > SHA256SUMS-win.txt
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Botling-2-${{ env.RELEASE_VERSION }}-win-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/SHA256SUMS-win.txt
            desktop/dist/SOURCE_COMMIT-win.txt

  linux:
    if: ${{ inputs.run_id == '' }}
    # Linux: AppImage (updates itself through electron-updater) and deb (cannot; it opens the release page).
    # Unsigned. Not run on real hardware.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      BOTLING_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Package Linux x64 AppImage and deb (never publishes)
        run: npm run dist:linux
      - name: Record source and checksums
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git rev-parse HEAD > dist/SOURCE_COMMIT-linux.txt
          cd dist
          ls -la
          sha256sum *.AppImage *.deb latest-linux.yml > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Botling-2-${{ env.RELEASE_VERSION }}-linux-x64-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest-linux.yml
            desktop/dist/SHA256SUMS-linux.txt
            desktop/dist/SOURCE_COMMIT-linux.txt

  publish:
    # Attaches the artifacts to the release for the tag and publishes it as Latest. Runs for a tag push, or for a
    # dispatch with tag + run_id. A plain branch dispatch only builds.
    needs: [candidate, windows, linux]
    if: >-
      ${{ !cancelled() && !failure() &&
      (github.ref_type == 'tag' || (inputs.tag != '' && inputs.run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      SOURCE_RUN: ${{ inputs.run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          persist-credentials: false
      - name: Download the build artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/assets"
          gh run download "$SOURCE_RUN" --dir "$RUNNER_TEMP/dl" --pattern '*-candidate'
          find "$RUNNER_TEMP/dl" -type f ! -name 'SOURCE_COMMIT*.txt' -exec mv {} "$RUNNER_TEMP/assets/" \;
          ls -la "$RUNNER_TEMP/assets"
      - name: Check the assets match the tag
        run: |
          VERSION="${TAG#v}"
          for f in "Botling-2-$VERSION-mac-arm64.zip" "Botling-2-$VERSION-mac-arm64.dmg" latest-mac.yml latest-linux.yml latest.yml; do
            [ -f "$RUNNER_TEMP/assets/$f" ] || { echo "::error::Missing asset $f for $TAG"; exit 1; }
          done
      - name: Create or update the release, upload the assets and publish it as Latest
        run: |
          SHA=$(git rev-parse HEAD)
          {
            awk -v v="${TAG#v}" '$0 ~ "^## " v "$" {f=1; next} /^## /{f=0} f' CHANGELOG.md
            echo
            echo "Built from commit ${SHA:0:7} by the release workflow. macOS (Apple silicon) builds are Developer ID signed and notarized. Linux and Windows builds are unsigned."
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Botling $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --draft --title "Botling $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber
          gh release edit "$TAG" --draft=false --latest
