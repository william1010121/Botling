name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          (cd Web && npm ci && npm test)
          swift test
      - name: Build ClaudeCodeBot.app
        run: scripts/make-app.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "ClaudeCodeBot $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
