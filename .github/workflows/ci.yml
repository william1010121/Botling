name: CI

# Answers one question: does it build, and do the fast, deterministic tests pass? The archived
# Swift 1.x app was removed (see git history up to v1.20.0).

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the full seed and crash-run counts and the Windows job, which pull requests skip (see the desktop job).
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  # The event is part of the group so the nightly run on main and a push to main do not cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      # Web typecheck/tests import ../desktop/src, which needs zod and friends.
      - run: npm ci --no-audit --no-fund --prefix ../desktop
      - run: npm run typecheck
      - run: npm test

  relay:
    name: Phone relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test

  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The core imports ../Web/src (see the desktop job).
      - run: npm ci --no-audit --no-fund --prefix ../Web
      - run: npm run perf

  desktop:
    name: Electron 2 checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The unit suite takes about 9 minutes on Ubuntu (4 workers) and over 35 on macOS and Windows (2 workers): 40 cut the
    # macOS job off before its summary was printed (every run since 2026-11-16).
    timeout-minutes: 80
    # Windows is reported but does not block yet: ~40 test files still assume POSIX paths or spawn
    # behaviour (tracked for 2.1.0). Remove this line when the Windows job is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runs on main and nightly only (it does not block merges); pull requests run macOS and Ubuntu.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["macos-26", "ubuntu-latest"]') || fromJSON('["macos-26", "ubuntu-latest", "windows-latest"]') }}
    # Seeded property and crash loops: pull requests run fewer (the first seeds); main, nightly and manual runs keep the
    # tests' own full counts, written out here because an empty value would not mean "default" for every knob.
    env:
      FORWARD_FAULT_RUNS: ${{ github.event_name == 'pull_request' && '2' || '6' }}
      V3_CONTENT_CRASH_RUNS: ${{ github.event_name == 'pull_request' && '5' || '20' }}
      V3_EFFECTS_CRASH_RUNS: ${{ github.event_name == 'pull_request' && '5' || '20' }}
      V3_STORE_CRASH_RUNS: ${{ github.event_name == 'pull_request' && '5' || '20' }}
      KERNEL_ACCEPTANCE_RUNS: ${{ github.event_name == 'pull_request' && '150' || '500' }}
      V3_GOSSIP_PROPERTY_SEEDS: ${{ github.event_name == 'pull_request' && '2' || '6' }}
      V3_LOG_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '10' || '30' }}
      # M7-11b swap-outbox property: 2,000 on pull requests and always on macOS (about 50 s on Linux; the macOS runner is several
      # times slower and 10,000 timed out there on push, run 44387426297; 2,000 is still past the D49 seed 20262478, run 1,363).
      # Main and nightly keep 10,000 on Ubuntu and Windows. A job-level env has no `runner` context, so this reads matrix.os.
      SWAP_OUTBOX_RUNS: ${{ (github.event_name == 'pull_request' || startsWith(matrix.os, 'macos')) && '2000' || '10000' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Desktop unit tests import ../Web/src (CodeMirror, markdown-it).
      - run: npm ci --no-audit --no-fund --prefix ../Web
      # Tests start the relay server (relay/src, a child process), which imports `ws` from relay/node_modules.
      - run: npm ci --no-audit --no-fund --prefix ../relay
      - name: Stable release gate (skipped for a dev-trial build)
        shell: bash
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").botlingDevTrial === true')" = true ]; then
            echo "Dev-trial build: stable release gate not applicable"
          else
            npm run release:check
          fi
      - run: npm run test:release
        if: ${{ !cancelled() }}
      # A plugin-only commit never moves MIN_FE_VERSION or the shell hash (scripts/check-shell-version.mjs). The base is the pull
      # request's base, or the push's `before`; empty (schedule, manual run) or all zeros (a new branch) makes the script use main.
      - name: Shell version rule
        shell: bash
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:shell-version -- "${BASE_SHA:-0}" HEAD
      # M7-S109: no product file over 800 lines except the frozen desktop/src/main/main.ts (scripts/line-baseline.json holds only that entry).
      - name: Product file size gate
        run: npm run check:lines
        if: ${{ !cancelled() }}
      # npm run typecheck is incremental (.cache/tsc); the build info stores content hashes, so a cache from an older
      # commit is safe and only the changed files are checked again.
      - uses: actions/cache@v4
        with:
          path: desktop/.cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}-
      # A cold cache on a macOS runner ran out of the default 2 GB heap (exit 134 on every run since 2026-11-16).
      - run: npm run typecheck
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # Ubuntu runners have 4 vCPUs: 4 test workers there (vitest.config.mts keeps 2 elsewhere).
      - run: npm run test:unit -- ${{ matrix.os == 'ubuntu-latest' && '--maxWorkers=4' || '' }}
        if: ${{ !cancelled() }}
      - run: npm run test:reports
        if: ${{ !cancelled() }}
      - name: Build the botling-agent release assets (never published here)
        if: ${{ !cancelled() }}
        run: npm run build && npm run dist:agent && sh -n dist/agent/botling-agent-install.sh && cat dist/agent/SHA256SUMS-agent.txt
      - run: npx playwright-core install chromium-headless-shell
        if: ${{ !cancelled() }}
      - run: npm run test:web-isolation
        if: ${{ !cancelled() }}

  spec:
    name: Spec models and conformance
    runs-on: ubuntu-latest
    # The model check alone took 19 minutes on 2026-11-18 (the call-in models grew); 20 cancelled test:spec.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The pinned tla2tools.jar (version and sha256 in spec/tools/tlc.sh), fetched once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/botling-spec
          key: tla2tools-${{ hashFiles('spec/tools/tlc.sh') }}
      - name: Model-check every spec/models/*
        run: spec/tools/check-models.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      # The core imports ../Web/src (see the desktop job).
      - run: npm ci --no-audit --no-fund --prefix ../Web
        working-directory: desktop
      # spec/tests import vitest and the app the way desktop's tests do (desktop/scripts/link-deps.sh does this locally).
      - run: ln -sfn ../desktop/node_modules spec/node_modules
      - run: npm run test:spec
        working-directory: desktop
