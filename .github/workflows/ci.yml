name: CI

# Answers one question: does it build, and do the fast, deterministic tests pass? Tests that run
# real processes or wait on real time are marked `.integration` / `.wallClock` and skip themselves
# when CI is set (GitHub sets it); they run locally with `swift test`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Built web output is committed
        run: |
          npm run build
          git diff --exit-code -- ../Sources/ClaudeCodeBot/Resources

  swift:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Fast tests
        run: swift test --skip-build --no-parallel

  desktop:
    name: Electron 2 checks
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run release:check
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:reports
      - run: npm run test:web-isolation
