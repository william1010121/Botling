name: CI

# Answers one question: does it build, and do the fast, deterministic tests pass? Tests that run
# real processes or wait on real time are marked `.integration` / `.wallClock` and skip themselves
# when CI is set (GitHub sets it); they run locally with `swift test`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      # Web typecheck/tests import ../desktop/src, which needs zod and friends.
      - run: npm ci --no-audit --no-fund --prefix ../desktop
      - run: npm run typecheck
      - run: npm test
      - name: Built web output is committed
        run: |
          npm run build
          git diff --exit-code -- ../Sources/ClaudeCodeBot/Resources

  swift:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Fast tests
        run: swift test --skip-build --no-parallel

  desktop:
    name: Electron 2 checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Windows is reported but does not block yet: ~40 test files still assume POSIX paths or spawn
    # behaviour (tracked for 2.1.0). Remove this line when the Windows job is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Desktop unit tests import ../Web/src (CodeMirror, markdown-it).
      - run: npm ci --no-audit --no-fund --prefix ../Web
      - name: Stable release gate (skipped for a dev-trial build)
        shell: bash
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").botlingDevTrial === true')" = true ]; then
            echo "Dev-trial build: stable release gate not applicable"
          else
            npm run release:check
          fi
      - run: npm run test:release
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run test:unit
        if: ${{ !cancelled() }}
      - run: npm run test:reports
        if: ${{ !cancelled() }}
      - run: npx playwright-core install chromium-headless-shell
        if: ${{ !cancelled() }}
      - run: npm run test:web-isolation
        if: ${{ !cancelled() }}
