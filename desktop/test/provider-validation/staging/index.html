<!doctype html><html lang="zh-Hant" data-theme="light"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'"><title>Isolated ACP acceptance</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:30px;font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--ground);color:var(--text)}main{max-width:620px;margin:auto}header small{color:var(--muted);font-size:12px}h1{font-size:23px;letter-spacing:-.6px;margin:9px 0}p{color:var(--muted);line-height:1.6;margin:0 0 20px}.panel{border:1px solid var(--border);border-radius:14px;background:var(--bubble);padding:20px;box-shadow:0 2px 7px #00000004}#status{font-weight:500;line-height:1.6;margin-bottom:16px}#status:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:9px}button,select{font:inherit;border-radius:8px;border:1px solid var(--border);padding:9px 14px;background:var(--bubble);color:var(--text)}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}#write{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500;min-width:148px}.actions{display:flex;gap:10px}details{margin-top:18px;font-size:12px;color:var(--muted)}summary{cursor:pointer;padding:5px 0}label{display:block;margin-top:10px}select{font-size:12px;margin:7px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6}#error:empty{display:none}#error{color:var(--error);font-size:13px;margin-top:14px;overflow-wrap:anywhere}section{border-top:1px solid var(--border);padding:14px 0}section small{overflow-wrap:anywhere;color:var(--muted)}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.choice .detail{display:block;color:var(--muted);font-size:12px}footer{font-size:12px;color:var(--faint);margin-top:18px}
</style><main><header><small id="mode">正在連接介面…</small><h1>Antigravity 驗收</h1><p id="description">正在準備隔離環境。</p></header><div class="panel"><div id="status" role="status" aria-live="polite">載入中…</div><div class="actions"><button id="write" disabled>開始寫檔驗收</button><button id="cancel" disabled>停止</button></div><div id="error" role="alert"></div><div id="cards"></div></div><details><summary>案例與技術資訊</summary><label for="case">驗收案例</label><select id="case" disabled><option value="write">寫入 allow-marker.txt = ALLOWED</option><option value="command">sleep 30 與取消</option></select><pre id="details"></pre></details><footer>不會自動登入或替你核准。</footer></main><script src="renderer.js"></script></html>
