<div class="note">
  <div class="note-status">
    <span class="nb-btitle">
      <b>
        "白板預覽"
      <span>
        "只能看 · 雙擊卡片跳到那一格"
    <button type="button" class="nb-crumb" hidden="" title="" aria-haspopup="true">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      <span>
        "路線："
    <span class="nb-st">
      "Saved"
    <span class="nb-sep" aria-hidden="true">
    <button type="button" class="nb-board" aria-pressed="false" title="白板預覽：把這份 Note 畫成由上往下的流程（再按一次或 Esc 回來）">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      <span>
        "白板"
      <kbd>
        "Esc"
  <div class="note-warn" hidden="">
  <div class="note-warn note-kept" hidden="">
  <div class="note-body">
    <div class="note-page">
      <div class="note-doc">
        <div class="cell cell-markdown" data-type="markdown" data-start="0" data-end="1" data-a="0" data-b="1">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-first" data-i="0">
            "alpha"
          <div class="nl" data-i="1">
            "beta"
        <div class="cell cell-markdown" data-type="markdown" data-start="3" data-end="4" data-a="3" data-b="4">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-li nl-first" data-i="3" style="padding-left: 0px;">
            <span class="mark">
              "•"
            <span class="txt">
              "gamma"
          <div class="nl nl-li" data-i="4" style="padding-left: 0px;">
            <span class="mark">
              "•"
            <span class="txt">
              "more"
        <div class="cell cell-markdown" data-type="markdown" data-start="6" data-end="7" data-a="6" data-b="7">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-first" data-i="6">
            "delta"
          <div class="nl nl-empty nl-edge" data-i="7">
      <div class="nc-layer">
      <div class="nd-zone" hidden="">
      <div class="nd-line" hidden="">
        <span class="nd-tag">
  <div class="nw" hidden="" tabindex="-1" role="region" aria-label="白板預覽">
    <div class="nw-world">
      <svg class="nw-lines" aria-hidden="true"/>
    <div class="nw-legend">
      <span>
        <i style="background:var(--n-c-text)">
        "Markdown"
      <span>
        <i style="background:var(--n-c-code)">
        "程式碼"
      <span>
        <i style="background:var(--n-c-card)">
        "即時卡片"
      <span>
        <i style="background:var(--n-c-branch)">
        "分岔 / 路線"
    <div class="nw-map" title="小地圖：藍框是現在看到的範圍；按一下移到那裡">
    <div class="nw-zoom">
      <button type="button" aria-label="縮小">
        "−"
      <output>
        "100%"
      <button type="button" aria-label="放大">
        "+"
      <i>
      <button class="nw-fit" type="button" title="整份縮到剛好看完（⌘ + 滾輪縮放）">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"/>
        "符合畫面"
    <div class="nw-none" hidden="">
      "這份 Note 還是空的"
  <input type="file" accept="image/*" multiple="" hidden="" value="">
  <textarea class="nsel-sink" tabindex="-1" aria-label="選取的內容" value="">
--- host calls
viewGet
read
parse
localizeImages
write "alpha\nbeta\n<!-- cell -->\n- gamma\n- more\n<!-- cell -->\ndelta\n" base=1
write "alpha\nbeta\n<!-- cell -->\ndelta\n\n<!-- cell -->\n- gamma\n- more" base=2
parse
viewSet {"routes":{},"folds":{},"pos":{"line":3,"caret":0,"scroll":0,"editing":true,"text":"delta"}}
viewSet {"routes":{},"folds":{},"pos":{"line":3,"caret":0,"scroll":0,"editing":true,"text":"- gamma"}}
write "alpha\nbeta\n<!-- cell -->\n- gamma\n- more\n<!-- cell -->\ndelta\n" base=3
parse
--- saved note
"alpha\nbeta\n<!-- cell -->\n- gamma\n- more\n<!-- cell -->\ndelta\n"
