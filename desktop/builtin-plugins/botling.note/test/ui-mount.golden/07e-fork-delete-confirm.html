<div class="note">
  <div class="note-status">
    <span class="nb-btitle">
      <b>
        "白板預覽"
      <span>
        "只能看 · 雙擊卡片跳到那一格"
    <button type="button" class="nb-crumb" title="學習率 › mid" aria-haspopup="true">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      <span>
        "路線：學習率 › mid"
    <span class="nb-st">
      "Saved"
    <span class="nb-sep" aria-hidden="true">
    <button type="button" class="nb-board" aria-pressed="false" title="白板預覽：把這份 Note 畫成由上往下的流程（再按一次或 Esc 回來）">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      <span>
        "白板"
      <kbd>
        "Esc"
  <div class="note-warn" hidden="">
  <div class="note-warn note-kept" hidden="">
  <div class="note-body">
    <div class="note-page">
      <div class="note-doc">
        <div class="cell cell-markdown" data-type="markdown" data-start="0" data-end="0" data-a="0" data-b="0">
          <button type="button" class="cell-ask" title="問 Bot（回答掛在右側旁註）" aria-label="問 Bot（回答掛在右側旁註）">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-first" data-i="0">
            "intro"
        <div class="cell cell-branch" data-type="branch" data-fork="學習率#1" data-b="2" data-a="2">
          <button type="button" class="cell-ask" title="問 Bot（回答掛在右側旁註）" aria-label="問 Bot（回答掛在右側旁註）">
          <div class="nb-fork" data-fork="學習率#1">
            <button type="button" class="nb-fl" title="點一下改分叉名稱">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
              "學習率"
            <div class="nb-tabs" role="tablist" aria-label="學習率的路線">
              <button type="button" class="nb-tab" role="tab" aria-selected="false" title="雙擊或右鍵可以改名、刪除；拖一格到這裡放進這條路線" data-route="slow">
                "slow"
              <button type="button" class="nb-tab" role="tab" aria-selected="false" title="雙擊或右鍵可以改名、刪除；拖一格到這裡放進這條路線" data-route="fast">
                "fast"
              <button type="button" class="nb-tab" role="tab" aria-selected="true" title="雙擊或右鍵可以改名、刪除；拖一格到這裡放進這條路線" data-route="mid">
                "mid"
            <button type="button" class="nb-add" title="新增路線" aria-label="新增路線">
              "+"
        <div class="cell cell-markdown cell-active" data-type="markdown" data-start="8" data-end="8" data-a="8" data-b="8">
          <button type="button" class="cell-ask" title="問 Bot（回答掛在右側旁註）" aria-label="問 Bot（回答掛在右側旁註）">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-active" data-i="8">
            <textarea rows="1" style="height: 0px;" value="" [focus]>
        <button type="button" class="nb-end" title="「學習率」到此結束，點一下在這之後接著寫" data-fork-end="學習率#1" data-b="9" data-a="9">
          "分叉結束 · 往下是所有路線共用的內容"
        <div class="cell cell-markdown" data-type="markdown" data-start="10" data-end="11" data-a="10" data-b="11">
          <button type="button" class="cell-ask" title="問 Bot（回答掛在右側旁註）" aria-label="問 Bot（回答掛在右側旁註）">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-first" data-i="10">
            "after"
          <div class="nl nl-empty nl-edge" data-i="11">
      <div class="nc-layer">
      <div class="nd-zone" hidden="">
      <div class="nd-line" hidden="">
        <span class="nd-tag">
  <div class="nw" hidden="" tabindex="-1" role="region" aria-label="白板預覽">
    <div class="nw-world">
      <svg class="nw-lines" aria-hidden="true"/>
    <div class="nw-legend">
      <span>
        <i style="background:var(--n-c-text)">
        "Markdown"
      <span>
        <i style="background:var(--n-c-code)">
        "程式碼"
      <span>
        <i style="background:var(--n-c-card)">
        "即時卡片"
      <span>
        <i style="background:var(--n-c-branch)">
        "分岔 / 路線"
    <div class="nw-map" title="小地圖：藍框是現在看到的範圍；按一下移到那裡">
    <div class="nw-zoom">
      <button type="button" aria-label="縮小">
        "−"
      <output>
        "100%"
      <button type="button" aria-label="放大">
        "+"
      <i>
      <button class="nw-fit" type="button" title="整份縮到剛好看完（⌘ + 滾輪縮放）">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"/>
        "符合畫面"
    <div class="nw-none" hidden="">
      "這份 Note 還是空的"
  <input type="file" accept="image/*" multiple="" hidden="" value="">
  <textarea class="nsel-sink" tabindex="-1" aria-label="選取的內容" value="">
<div class="nb-menu" role="menu" style="left: 8px; top: 4px;">
  <div class="nb-mh">
    "「mid」與裡面的 1 行會被刪掉"
  <button type="button" class="nb-mi danger" role="menuitem" aria-selected="false">
    <span class="ic">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
    <span class="lb">
      "確定刪除"
  <button type="button" class="nb-mi" role="menuitem" aria-selected="false">
    <span class="lb">
      "取消"
--- host calls
viewGet
read
parse
localizeImages
viewSet {"routes":{"學習率#1":"fast"},"folds":{},"pos":{"line":0,"caret":0,"scroll":0,"editing":false,"text":"intro"}}
viewSet {"routes":{"學習率#1":"mid"},"folds":{},"pos":{"line":8,"caret":0,"scroll":0,"editing":true,"text":""}}
write "intro\n<!-- cell -->\n<!-- branch: 學習率 -->\n<!-- route: slow -->\nslow text\n<!-- route: fast -->\nfast text\n<!-- route: mid -->\n\n<!-- end branch -->\nafter\n" base=1
parse
--- saved note
"intro\n<!-- cell -->\n<!-- branch: 學習率 -->\n<!-- route: slow -->\nslow text\n<!-- route: fast -->\nfast text\n<!-- route: mid -->\n\n<!-- end branch -->\nafter\n"
