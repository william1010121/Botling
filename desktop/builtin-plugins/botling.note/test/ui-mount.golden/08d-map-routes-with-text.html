<div class="note">
  <div class="note-status">
    <span class="nb-btitle">
      <b>
        "白板預覽"
      <span>
        "只能看 · 雙擊卡片跳到那一格"
    <button type="button" class="nb-crumb" title="A › a1 › b1" aria-haspopup="true" aria-expanded="true">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      <span>
        "路線：A › a1 › b1"
    <span class="nb-st">
      "Saved"
    <span class="nb-sep" aria-hidden="true">
    <button type="button" class="nb-board" aria-pressed="false" title="白板預覽：把這份 Note 畫成由上往下的流程（再按一次或 Esc 回來）">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      <span>
        "白板"
      <kbd>
        "Esc"
  <div class="note-warn" hidden="">
  <div class="note-warn note-kept" hidden="">
  <div class="note-body">
    <div class="note-page">
      <div class="note-doc">
        <div class="cell cell-markdown" data-type="markdown" data-start="0" data-end="0" data-a="0" data-b="0">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-first" data-i="0">
            "intro"
        <div class="cell cell-branch" data-type="branch" data-fork="A#1" data-b="2" data-a="2">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="nb-fork" data-fork="A#1">
            <button type="button" class="nb-fl" title="點一下改分叉名稱">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
              "A"
            <div class="nb-tabs" role="tablist" aria-label="A的路線">
              <button type="button" class="nb-tab" role="tab" aria-selected="true" title="雙擊或右鍵可以改名、刪除；拖一格到這裡放進這條路線" data-route="a1">
                "a1"
                <span class="nb-cnt">
                  "⑂ 2"
              <button type="button" class="nb-tab" role="tab" aria-selected="false" title="雙擊或右鍵可以改名、刪除；拖一格到這裡放進這條路線" data-route="a2">
                "a2"
            <button type="button" class="nb-add" title="新增路線" aria-label="新增路線">
              "+"
        <div class="cell cell-markdown" data-type="markdown" data-start="4" data-end="4" data-a="4" data-b="4">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-first" data-i="4">
            "x"
        <div class="cell cell-branch" data-type="branch" data-fork="A#1/a1>B#1" data-b="5" data-a="5">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="nb-fork" data-fork="A#1/a1>B#1">
            <button type="button" class="nb-fl" title="點一下改分叉名稱">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
              "B"
            <div class="nb-tabs" role="tablist" aria-label="B的路線">
              <button type="button" class="nb-tab" role="tab" aria-selected="true" title="雙擊或右鍵可以改名、刪除；拖一格到這裡放進這條路線" data-route="b1">
                "b1"
              <button type="button" class="nb-tab" role="tab" aria-selected="false" title="雙擊或右鍵可以改名、刪除；拖一格到這裡放進這條路線" data-route="b2">
                "b2"
            <button type="button" class="nb-add" title="新增路線" aria-label="新增路線">
              "+"
        <div class="cell cell-markdown" data-type="markdown" data-start="7" data-end="7" data-a="7" data-b="7">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-first" data-i="7">
            "y"
        <button type="button" class="nb-end" title="「B」到此結束，點一下在這之後接著寫" data-fork-end="A#1/a1>B#1" data-b="10" data-a="10">
          "分叉結束 · 往下是所有路線共用的內容"
        <button type="button" class="nb-end" title="「A」到此結束，點一下在這之後接著寫" data-fork-end="A#1" data-b="13" data-a="13">
          "分叉結束 · 往下是所有路線共用的內容"
        <div class="cell cell-markdown" data-type="markdown" data-start="14" data-end="15" data-a="14" data-b="15">
          <button type="button" class="cell-ask" title="引用到對話裡問" aria-label="引用到對話裡問">
          <div class="cell-grip" title="拖曳來移動這一格（也可以用 ⌥↑ / ⌥↓）" aria-label="拖曳來移動這一格">
          <div class="cell-bar">
          <div class="nl nl-first" data-i="14">
            "end"
          <div class="nl nl-empty nl-edge" data-i="15">
      <div class="nc-layer">
      <div class="nd-zone" hidden="">
      <div class="nd-line" hidden="">
        <span class="nd-tag">
  <div class="nw" hidden="" tabindex="-1" role="region" aria-label="白板預覽">
    <div class="nw-world">
      <svg class="nw-lines" aria-hidden="true"/>
    <div class="nw-legend">
      <span>
        <i style="background:var(--n-c-text)">
        "Markdown"
      <span>
        <i style="background:var(--n-c-code)">
        "程式碼"
      <span>
        <i style="background:var(--n-c-card)">
        "即時卡片"
      <span>
        <i style="background:var(--n-c-branch)">
        "分岔 / 路線"
    <div class="nw-map" title="小地圖：藍框是現在看到的範圍；按一下移到那裡">
    <div class="nw-zoom">
      <button type="button" aria-label="縮小">
        "−"
      <output>
        "100%"
      <button type="button" aria-label="放大">
        "+"
      <i>
      <button class="nw-fit" type="button" title="整份縮到剛好看完（⌘ + 滾輪縮放）">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"/>
        "符合畫面"
    <div class="nw-none" hidden="">
      "這份 Note 還是空的"
  <input type="file" accept="image/*" multiple="" hidden="" value="">
  <textarea class="nsel-sink" tabindex="-1" aria-label="選取的內容" value="">
<nav class="nb-map" aria-label="分支總覽" style="left: 12px; top: 6px; max-height: 744px;">
  <button type="button" class="nb-node">
    <span class="" style="color: var(--n-faint);">
      "≡"
    <span class="nm">
      "共用開頭"
    <span class="meta">
  <div class="nb-fk">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
    "A · 2 條路線"
  <div class="nb-kids">
    <button type="button" class="nb-node on">
      <span class="dot">
      <span class="nm">
        "a1"
      <span class="meta">
        "3 行"
    <div class="nb-fk">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
      "B · 2 條路線"
    <div class="nb-kids">
      <button type="button" class="nb-node on">
        <span class="dot">
        <span class="nm">
          "b1"
        <span class="meta">
          "你在這裡 · 1 行"
      <button type="button" class="nb-node">
        <span class="dot">
        <span class="nm">
          "b2"
        <span class="meta">
          "1 行"
    <button type="button" class="nb-node">
      <span class="dot">
      <span class="nm">
        "a2"
      <span class="meta">
        "1 行"
  <div class="nb-maphint">
    "點一條路線：切過去並捲到分叉處。分頁上雙擊或按右鍵可以改名、刪除。"

viewGet
read

localizeImages
