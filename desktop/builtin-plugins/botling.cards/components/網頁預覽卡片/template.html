<meta name="ccb-kit" content="1">
<style>
  .preview-shot { position:relative; display:block; width:100%; height:270px; overflow:hidden; background:#fff; cursor:pointer; }
  .preview-shot:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .preview-shot iframe, .preview-shot img { position:absolute; top:0; left:0; width:1280px; height:800px; border:0; background:#fff; transform-origin:0 0; pointer-events:none; }
  .preview-foot { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .preview-names { flex:1; min-width:0; overflow-wrap:anywhere; }
  .preview-title { font-weight:600; }
  .preview-name { font-size:12px; opacity:.7; }
</style>
<div id="app"></div>
<script>
  const { html, render, useData, useRef, useLayoutEffect, Card, Button, Empty } = ccb.kit;
  function Preview() {
    const data = useData();
    const shot = useRef(null);
    const frame = useRef(null);
    const title = data.title || data.name || '網頁預覽';
    const canOpen = !!data.url && !data.missing;
    const hasPreview = !!data.src && !data.missing;
    const open = () => { if (canOpen) ccb.open(data.url, title); };
    useLayoutEffect(() => {
      if (!hasPreview) return;
      const fit = () => {
        const scale = shot.current.clientWidth / 1280;
        if (!scale) return;
        frame.current.style.transform = 'scale(' + scale + ')';
        shot.current.style.height = Math.round(800 * scale) + 'px';
      };
      const observer = new ResizeObserver(fit);
      observer.observe(shot.current);
      fit();
      return () => observer.disconnect();
    }, [hasPreview, data.src, data.shot]);
    const keyboardOpen = (event) => {
      if (!event.isComposing && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault(); open();
      }
    };
    const footer = html`<div class="preview-foot">
      <div class="preview-names"><div class="preview-title">${title}</div>
        ${data.name && data.name !== title && html`<div class="preview-name">${data.name}</div>`}
      </div>
      <${Button} tone="primary" disabled=${!canOpen} onClick=${open}>開啟完整頁面</${Button}>
    </div>`;
    return html`<${Card} framed=${true} footer=${footer}>
      ${hasPreview ? html`<div class="preview-shot" ref=${shot} role="button" tabIndex=${canOpen ? 0 : -1}
        aria-disabled=${!canOpen} aria-label=${'開啟完整頁面：' + title} onClick=${open} onKeyDown=${keyboardOpen}>
        ${data.shot
          ? html`<img ref=${frame} src=${data.shot} alt="" aria-hidden="true" tabIndex=${-1} />`
          : html`<iframe ref=${frame} src=${data.src} sandbox="allow-scripts" aria-hidden="true" tabIndex=${-1}></iframe>`}
      </div>` : html`<${Empty} title=${data.missing ? '找不到這個檔案' : '這個頁面無法預覽'} />`}
    </${Card}>`;
  }
  render(html`<${Preview} />`);
</script>
