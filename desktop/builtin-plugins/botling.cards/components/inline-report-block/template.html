<meta name="ccb-kit" content="1">
<style>
/* Look and block markup: hand port of Botling's report renderer (botling.report, ReportSpec v2 blocks).
   The stylesheet below is copied from the renderer's own output (same tokens, same block rules) so both stay identical;
   the block HTML is rebuilt by the script (no code from the report bundle or its third-party packages is used:
   the flowchart layout is a small layered layout written for this card). Source: Botling botling.report, GPL-3.0-or-later. */
/* Colours come from the host: the frame injects Botling's design tokens (--bubble, --hover, --chip, --line, --border, --text, --muted,
   --faint, --blue, --green, --orange, --error …) and sets <html data-theme="dark|light">, following the app, because of the ccb-kit marker
   above. Only what the host lacks is defined here. */
.ib{--unv:#6C6C75;--on-accent:#FFFFFF;
--sys:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
html[data-theme="light"] .ib{--unv:#8A8A93}
.t-good{--tone:var(--green)}.t-warn{--tone:var(--orange)}.t-bad{--tone:var(--error)}.t-info{--tone:var(--blue)}.t-neutral{--tone:var(--unv)}.t-none{--tone:var(--border)}
.ib *{box-sizing:border-box}
.ib{box-sizing:border-box;color:var(--text);font:15px/1.5 var(--sys);-webkit-font-smoothing:antialiased;overflow-wrap:anywhere;padding:12px;width:100%;min-width:0}
.sr-only{position:absolute!important;left:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:normal;word-break:break-all;border:0}
.ib :focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.ib code{font:.85em var(--mono);background:var(--chip);border-radius:6px;padding:.1em .4em}
.ib h3,.ib h4,.ib p{margin:0}
.pill{display:inline-flex;align-items:center;flex:none;border:1px solid currentColor;border-radius:100px;padding:1px 9px;font-size:12px;font-weight:650;line-height:1.5;color:var(--tone,var(--muted));white-space:nowrap}
.pill.t-neutral{color:var(--muted)}
/* Blocks are sized in em (1em = 15px in a document, larger on slides) so one stylesheet serves both. */
.blk{margin:0;min-width:0;container:blk/inline-size;font-size:15px}
.blk>*{margin:0}
.blk:not(.plain):not(.blk-prose):not(.blk-callout):not(.blk-quote):not(.blk-sources):not(.blk-error){background:var(--bubble);border:1px solid var(--border);border-radius:16px;padding:1.33em 1.47em}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:.8em;margin-bottom:1.07em}
.bh h3{font-size:1em;font-weight:600;line-height:1.4;margin:0}
.bh p{font-size:.833em;color:var(--faint);margin:0;flex:none;max-width:45%;text-align:right}
@container blk (max-width:420px){.bh{flex-direction:column;gap:.1em}.bh p{text-align:left;max-width:none}}
.sw{display:inline-block;width:.6em;height:.6em;border-radius:3px;background:var(--c);flex:none}
.legend{list-style:none;margin:-.4em 0 .9em;padding:0;display:flex;flex-wrap:wrap;gap:.3em 1.1em;font-size:.833em;color:var(--muted)}
.legend li{display:inline-flex;align-items:center;gap:.45em}
.dl{display:inline-flex;align-items:center;font-size:.8em;font-weight:650;color:var(--tone);background:color-mix(in srgb,var(--tone) 14%,transparent);border-radius:6px;padding:.05em .45em;font-variant-numeric:tabular-nums}
.dl.t-neutral{color:var(--muted)}
.segbar{display:flex;gap:3px;height:8px}
.segbar.lg{height:10px;margin-top:1.07em}
.seg{border-radius:5px;background:var(--tone);min-width:6px}
.verdict-line{margin-top:1em!important;padding-top:.85em;border-top:1px solid var(--line);font-size:.93em;color:var(--text);display:flex;gap:.6em;align-items:baseline}
.verdict-line b{flex:none;font-size:.85em;font-weight:650;color:var(--blue);letter-spacing:.04em}

/* prose / callout / quote / sources */
.blk-prose{font-size:15px;line-height:1.65;color:var(--text);max-width:42em}
.blk-prose .md>*{margin:0 0 .6em}.blk-prose .md>*:last-child{margin-bottom:0}
.blk-prose ul,.blk-prose ol{padding-left:1.3em}
.blk-prose li{margin:.2em 0}
.blk-prose li::marker{color:var(--faint)}
.blk-prose strong{font-weight:650}
.blk-callout{display:flex;gap:.8em;align-items:flex-start;background:color-mix(in srgb,var(--tone) 8%,var(--bubble));border:1px solid color-mix(in srgb,var(--tone) 30%,var(--border));border-left:4px solid var(--tone);border-radius:14px;padding:.95em 1.2em}
.blk-callout .cg{font-style:normal;flex:none;width:1.4em;height:1.4em;border-radius:50%;background:var(--tone);color:var(--on-accent);font-size:.8em;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:.15em}
.blk-callout .ct{font-weight:600;margin:0 0 .15em}
.blk-callout .cx{color:var(--muted);margin:0;font-size:.93em;line-height:1.6}
.blk-callout.t-neutral .cg{background:var(--muted)}
.blk-quote{border-left:3px solid var(--blue);padding:.2em 0 .2em 1.1em}
.blk-quote p{font-size:1.2em;font-weight:500;line-height:1.55}
.blk-quote footer{margin-top:.4em;font-size:.833em;color:var(--faint)}
.blk-sources{padding:.27em .27em 0}
.blk-sources h3{font-size:.833em;font-weight:600;color:var(--faint);letter-spacing:.04em;margin:0 0 .55em}
.blk-sources ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.4em 1.6em}
.blk-sources li{font-size:.87em;color:var(--muted);display:flex;align-items:baseline;gap:.5em;min-width:0}
.blk-sources code{color:var(--text);flex:none;font-size:.88em}
@container blk (max-width:560px){.blk-sources ul{grid-template-columns:1fr}}
.blk-error{border:1px dashed var(--error);border-radius:14px;padding:.9em 1.1em;background:color-mix(in srgb,var(--error) 6%,var(--bubble))}
.blk-error p{margin:0;display:flex;gap:.6em;align-items:baseline;flex-wrap:wrap}
.blk-error b{color:var(--error);font-weight:600}
.blk-error .em{font-size:.833em;color:var(--faint);margin-top:.3em}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(7em,1fr));gap:1em 1.2em;margin:0}
.kpi{display:flex;flex-direction:column;gap:.15em;min-width:0}
.kpi dd{margin:0}
.kpi dt{order:2;font-size:.833em;color:var(--faint)}
.kpi .kv{order:1;display:flex;align-items:baseline;gap:.25em}
.kpi .kv b{font-size:2em;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .kv small{font-size:.93em;color:var(--muted);font-weight:500}
.kpi[class*=" t-"] .kv b{color:var(--tone)}
.kpi.t-neutral .kv b{color:var(--muted)}
.kpi .kd{order:3;display:flex;flex-wrap:wrap;gap:.4em;align-items:center;margin-top:.3em}
.kpi .tg{font-size:.8em;color:var(--faint)}
@container blk (max-width:520px){
  .blk-kpi .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .blk-kpi.n3 .kpis .kpi:first-child,.blk-kpi.n5 .kpis .kpi:first-child{grid-column:1/-1}
  .kpi .kv b{font-size:1.75em}
}

/* matrix: a placement grid */
.mx-scroll{overflow-x:auto;margin:0 -.2em;padding:0 .2em}
.mx{border-collapse:separate;border-spacing:.45em;margin:-.45em;width:calc(100% + .9em);table-layout:fixed}
.mx thead th{font-size:.833em;font-weight:600;color:var(--muted);text-align:center;padding:0 0 .1em}
.mx thead td{width:3.6em}
.mx tbody th{font-size:.87em;font-weight:600;color:var(--muted);text-align:left;white-space:nowrap;padding-right:.2em}
.mc{height:3.3em;border-radius:12px;background:var(--hover);text-align:center;vertical-align:middle;padding:.35em}
.mc.on{background:var(--chip)}
.mc.num{font-size:.87em;font-weight:600;font-variant-numeric:tabular-nums;height:2.9em}
.mx.dense .mc{height:2.2em;border-radius:6px;padding:.1em}
.mx.dense{border-spacing:.2em;min-width:calc(var(--cols) * 2.6em + 4em)}
.chip{display:inline-block;margin:.15em;padding:.15em .55em;border-radius:999px;font-size:.8em;font-weight:600;background:var(--tone);color:var(--on-accent);line-height:1.4}
.chip.t-neutral{background:var(--unv)}

/* timeline: event log */
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev li{display:grid;grid-template-columns:6.4em 1.2em minmax(0,1fr);gap:.2em .6em;position:relative;padding-bottom:.95em}
.ev li:last-child{padding-bottom:0}
.ev time{font-size:.833em;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;padding-top:.15em;white-space:nowrap}
.ev li>i{position:relative;display:flex;justify-content:center}
.ev li>i::before{content:"";width:.75em;height:.75em;border-radius:50%;background:var(--tone);margin-top:.35em;box-shadow:0 0 0 3px var(--bubble);z-index:1}
.ev li.t-none>i::before{background:var(--bubble);border:2px solid var(--unv)}
.ev li>i::after{content:"";position:absolute;top:.6em;bottom:-1.3em;left:50%;border-left:1.5px solid var(--line)}
.ev li:last-child>i::after{display:none}
.evl{font-weight:600;line-height:1.45;margin:0}
.evt{font-size:.87em;color:var(--muted);margin:.1em 0 0}
@container blk (max-width:420px){.ev li{grid-template-columns:1.2em minmax(0,1fr);}.ev time{grid-column:2;text-align:left;order:-1;padding:0}.ev li>i{grid-row:1/span 3;grid-column:1}}

/* timeline: gantt */
.gt{--lab:11em;font-size:1em}
.gx{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);height:1.6em}
.gx div{position:relative}
.gx div span{position:absolute;transform:translateX(-50%);font-size:.75em;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.gb{position:relative;display:flex;flex-direction:column;gap:.3em}
.gb>.gl,.gb>.today{position:absolute;top:0;bottom:0;border:0;border-left:1px dashed var(--line);width:0;left:calc(var(--lab) + (100% - var(--lab)) * var(--x,0))}
.today{border-left:1.5px solid var(--error)!important;z-index:2}
.today em{position:absolute;top:-1.6em;left:0;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:.7em;font-weight:650;color:var(--error);background:var(--bubble);padding:0 .3em;border-radius:4px}
.glane{display:flex;flex-direction:column;gap:.3em}
.glane+.glane{border-top:1px solid var(--line);padding-top:.5em;margin-top:.3em}
.glh{font-size:.75em;font-weight:650;color:var(--faint);letter-spacing:.04em;margin:0}
.gr{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);align-items:center;min-height:2em}
.gl-l{font-size:.87em;margin:0;padding-right:.8em;line-height:1.3}
.gtrk{position:relative;height:1.35em}
.gbar{position:absolute;top:0;bottom:0;border-radius:6px;background:color-mix(in srgb,var(--tone) 80%,transparent);min-width:6px}
.gbar.t-none,.gms.t-none{--tone:var(--unv)}
.gms{position:absolute;top:50%;width:.9em;height:.9em;background:var(--tone);transform:translate(-50%,-50%) rotate(45deg);border-radius:2px}
@container blk (max-width:520px){.gt{--lab:6.5em}.gl-l{font-size:.8em}}

/* roadmap */
.rm{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:.8em}
.rm section{background:var(--hover);border-radius:12px;padding:.75em}
.rm section.now{background:color-mix(in srgb,var(--blue) 8%,var(--hover))}
.rm h4{display:flex;justify-content:space-between;align-items:baseline;font-size:.93em;font-weight:650;margin:0 0 .65em}
.rm h4 em{font-style:normal;font-size:.8em;font-weight:500;color:var(--faint)}
.rm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45em}
.chipcard{position:relative;background:var(--bubble);border:1px solid var(--border);border-radius:10px;padding:.55em .7em .55em .95em}
.chipcard::before{content:"";position:absolute;left:0;top:.6em;bottom:.6em;width:3px;border-radius:2px;background:var(--tone)}
.chipcard.t-none::before{display:none}
.chipcard.t-bad{border-color:color-mix(in srgb,var(--error) 55%,var(--border))}
.cct{font-size:.9em;font-weight:600;margin:0;line-height:1.35}
.ccm{font-size:.8em;color:var(--faint);margin:.15em 0 0}
.ccm .sc{color:var(--tone)}.t-neutral .ccm .sc{color:var(--muted)}
@container blk (max-width:560px){.rm{grid-template-columns:minmax(0,1fr)}}

/* flow */
.fl-wrap{display:flex;justify-content:center}
.fl{display:block;width:100%;height:auto;font-family:var(--sys);overflow:visible}
.fl.narrow{display:none}
@container blk (max-width:560px){.has-narrow .fl.wide{display:none}.has-narrow .fl.narrow{display:block}}
.fl .nb{fill:var(--chip);stroke:var(--border);stroke-width:1}
.fl .k-start .nb,.fl .k-end .nb{fill:var(--hover)}
.fl .k-decision .nb{fill:var(--bubble);stroke:var(--orange);stroke-dasharray:4 3}
.fl .hot .nb{fill:color-mix(in srgb,var(--error) 16%,var(--bubble));stroke:var(--error);stroke-width:1.5}
.fl .sb{fill:var(--tone)}
.fl .nt{font-size:14px;font-weight:600;fill:var(--text)}
.fl .ns{font-size:12px;fill:var(--faint)}
.fl .ns .sc{fill:var(--tone);font-weight:600}
.fl .t-neutral .ns .sc{color:var(--muted)}
.fl .edge{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linejoin:round}
.fl .edge.dash{stroke-dasharray:4 4}
.fl .ah{fill:none;stroke:var(--faint);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fl .el rect{fill:var(--bubble);stroke:var(--line)}
.fl .el text{font-size:12px;fill:var(--muted)}

/* sequence */
.sq{--n:3;display:flex;flex-direction:column}
.sqa,.sqs li{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.sqa{gap:0;margin-bottom:.3em}
.sqa span{justify-self:center;max-width:94%;text-align:center;background:var(--chip);border-radius:10px;padding:.4em .8em;font-size:.87em;font-weight:600}
.sqs{list-style:none;margin:0;padding:0;position:relative}
.sqs li{position:relative;min-height:2.6em;align-items:end}
.sqs li::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100% / var(--n) / 2 - .5px),var(--line) calc(100% / var(--n) / 2 - .5px),var(--line) calc(100% / var(--n) / 2 + .5px),transparent calc(100% / var(--n) / 2 + .5px),transparent calc(100% / var(--n)));pointer-events:none}
.sqm{position:relative;display:block;padding:0 var(--inset) .35em;z-index:1}
.sqm em{display:flex;justify-content:center;align-items:baseline;gap:.4em;font-style:normal;font-size:.85em;text-align:center;line-height:1.3;padding:0 .3em .2em}
.sqm b,.sqn b{flex:none;font-size:.8em;font-weight:650;color:var(--faint)}
.sqm i{display:block;height:0;border-top:1.5px solid var(--tone,var(--faint));position:relative}
.sqm.reply i{border-top-style:dashed}
.sqm i::after{content:"";position:absolute;top:-5px;width:8px;height:8px;border:solid var(--tone,var(--faint));border-width:1.5px 1.5px 0 0}
.sqm.r i::after{right:0;transform:rotate(45deg)}
.sqm.l i::after{left:0;transform:rotate(-135deg)}
.sqs li.t-none{--tone:var(--faint)}
.sqs li.t-bad em{color:var(--error);font-weight:600}
.sqn{z-index:1;justify-self:center;font-size:.8em;background:var(--hover);border:1px solid var(--border);border-radius:8px;padding:.25em .6em;margin-bottom:.35em;display:flex;gap:.4em;max-width:96%}

/* table + options */
.tbl-scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.93em}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:.6em .7em;border-top:1px solid var(--line)}
.tbl thead th{border-top:0;font-size:.85em;font-weight:600;color:var(--faint);padding-top:0}
.tbl tbody th{font-weight:600}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.hi>*{background:color-mix(in srgb,var(--blue) 9%,transparent)}
.tbl tr>*:first-child{padding-left:.2em}
.cell-s{display:inline-flex;align-items:baseline;gap:.45em;color:var(--text)}
.cell-s i{flex:none;width:.55em;height:.55em;border-radius:50%;background:var(--tone);transform:translateY(-.05em)}
.op thead th{vertical-align:bottom;color:var(--text);font-size:.93em}
.op thead th b{display:block;font-weight:650}
.op thead th small{display:block;font-size:.85em;font-weight:500;color:var(--faint)}
.op td.rec,.op th.rec{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.op thead th.rec{border-radius:10px 10px 0 0}
.op tbody tr:last-child td.rec{border-radius:0 0 10px 10px}
.badge{display:inline-block;font-size:.75em;font-weight:650;color:var(--on-accent);background:var(--blue);border-radius:6px;padding:.05em .45em;margin-bottom:.3em}
.op-c{display:inline-flex;gap:.45em;align-items:baseline}
.op-c i{font-style:normal;color:var(--tone);font-size:.85em}
.op-c.t-neutral i{color:var(--faint)}
.op-narrow{display:none}
@container blk (max-width:520px){
  .op-wide{display:none}
  .op-narrow{display:flex;flex-direction:column;gap:.6em}
  .op-card{border:1px solid var(--border);border-radius:12px;padding:.7em .85em}
  .op-card.rec{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 6%,transparent)}
  .oph{display:flex;gap:.5em;align-items:baseline;margin:0}.oph .badge{margin:0}
  .ops{font-size:.85em;color:var(--faint);margin:.1em 0 0}
  .op-card dl{margin:.5em 0 0;display:flex;flex-direction:column;gap:.25em}
  .op-card dl div{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:.5em;font-size:.9em}
  .op-card dt{color:var(--faint)}.op-card dd{margin:0}
}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:1.2em}
.pc h4{font-size:.833em;font-weight:650;letter-spacing:.04em;color:var(--tone);margin:0 0 .5em}
.pc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45em}
.pc li{display:flex;gap:.55em;font-size:.93em;line-height:1.45}
.pc li i{font-style:normal;flex:none;width:1.2em;height:1.2em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tone) 16%,transparent);color:var(--tone);font-weight:700;font-size:.85em;margin-top:.12em}
@container blk (max-width:420px){.pc{grid-template-columns:1fr}}

/* checklist / progress / steps */
.ck-sum{display:flex;flex-direction:column;gap:.5em;margin-bottom:.9em}
.ck-sum b{font-size:.93em;font-weight:650}
.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ck li{display:grid;grid-template-columns:1.5em minmax(0,1fr) auto;gap:.6em;align-items:start;padding:.55em 0;border-top:1px solid var(--line)}
.ck li:first-child{border-top:0;padding-top:0}.ck li:last-child{padding-bottom:0}
.ck li>i{font-style:normal;width:1.4em;height:1.4em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;color:var(--tone);background:color-mix(in srgb,var(--tone) 16%,transparent);margin-top:.1em}
.ck li.t-good>i{background:var(--tone);color:var(--on-accent)}
.ck li.t-neutral>i{color:var(--muted)}
.ck p{margin:0;font-size:.93em;line-height:1.45}
.ck .ckn{font-size:.85em;color:var(--faint)}
.cks{font-size:.75em;font-weight:650;color:var(--tone);white-space:nowrap;padding-top:.2em}
.ck li.t-neutral .cks{color:var(--muted)}
.pg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.85em}
.pg p{display:flex;justify-content:space-between;gap:.6em;margin:0 0 .35em;font-size:.93em}
.pg b{font-weight:650;font-variant-numeric:tabular-nums;font-size:.93em}
.track{height:.6em;border-radius:4px;background:var(--hover);overflow:hidden}
.fill{display:block;height:100%;border-radius:4px;background:var(--tone)}
.stp{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.8em}
.stp li{display:flex;gap:.65em;align-items:flex-start;background:var(--hover);border-radius:12px;padding:.75em .85em;position:relative}
.stp .n{font-style:normal;flex:none;width:1.45em;height:1.45em;border-radius:50%;background:var(--blue);color:var(--on-accent);font-size:.8em;font-weight:650;display:inline-flex;align-items:center;justify-content:center;margin-top:.1em}
.stp li.s-done .n{background:var(--green)}.stp li.s-blocked .n{background:var(--error)}
.stp .st{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;font-weight:600;font-size:.93em;margin:0;line-height:1.4}
.stp .st .pill{font-size:.75em;padding:0 .5em}
.stp .sx{font-size:.85em;color:var(--muted);margin:.15em 0 0;line-height:1.45}
.stp.compact li{padding:.5em .8em}
@container blk (max-width:460px){.stp{grid-template-columns:minmax(0,1fr)}}

/* image */
.im{position:relative;line-height:0;max-width:min(100%,40em);margin:0 auto}
.im img{width:100%;height:auto;border-radius:10px;border:1px solid var(--border)}
.ia{position:absolute;transform:translate(-50%,-50%);width:1.6em;height:1.6em;border-radius:50%;background:var(--orange);color:var(--on-accent);font-size:.8em;font-weight:700;line-height:1.6em;text-align:center;box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 35%,transparent)}
.blk-image figcaption{margin-top:.75em;font-size:.87em;color:var(--muted)}
.blk-image figcaption ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.3em 1.2em}
.blk-image figcaption li{display:flex;gap:.45em;align-items:center}
.blk-image figcaption li i{font-style:normal;width:1.45em;height:1.45em;border-radius:50%;background:var(--orange);color:var(--on-accent);font-size:.8em;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.blk-image figcaption p{margin:.4em 0 0}

@container blk (max-width:460px){.tr .xl span:nth-child(even):not(.last){display:none}}


/* glossary: term → one plain sentence */
.blk-glossary dl{margin:0;display:flex;flex-direction:column;gap:.55em}
.blk-glossary .gi{display:grid;grid-template-columns:minmax(4.5em,max-content) 1fr;gap:.2em .9em;align-items:baseline}
.blk-glossary dt{font-weight:650;color:var(--text)}
.blk-glossary dd{margin:0;color:var(--muted);line-height:1.6}

/* ── inline card: the chat bubble / Board tile / pin panel is the frame, so the block's own card frame is dropped ── */
.blk:not(.plain):not(.blk-prose):not(.blk-callout):not(.blk-quote):not(.blk-sources):not(.blk-error){background:none;border:0;border-radius:0;padding:0}
.blk-prose{max-width:none}
.blk-sources{padding:0}
.ib .bh{margin-bottom:.9em}
.ib .bh h3:empty{display:none}
.ib .blk-error{margin:0}
.ib .blk-error code{font-size:.9em;word-break:break-all;white-space:pre-wrap}
.ib .blk-error .em{margin-top:.45em}
.fl-wrap{overflow-x:auto}
.mx-scroll{overflow-y:hidden;scrollbar-width:thin}
.mx-scroll:not(.dense){overflow-x:hidden}
.mini{display:none}
html[data-surface="board"],html[data-surface="board"] body,html[data-surface="board"] #app{height:100%;margin:0}
html[data-surface="board"] .ib{height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
html[data-surface="pinned"] .ib{overscroll-behavior:contain}
/* narrow / tiny are decided by the script (data-narrow, data-tiny on #ib) from ccb.size, never in the chat */
.ib[data-narrow="1"],.ib[data-narrow="1"] .blk{font-size:13.5px}

/* tiny (about one cell, or very short): just the key value, big */
.mini{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-width:0;height:100%;color:var(--tone,var(--text))}
.mini.t-none,.mini.t-info,.mini.t-neutral{--tone:var(--text)}
.mini b{font-size:26px;line-height:1.12;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;max-width:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini span{font-size:12.5px;color:var(--muted);max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ib[data-tiny="1"]{height:100%;padding:12px}
.ib[data-tiny="1"] .full{display:none}
.ib[data-tiny="1"] .mini{display:flex}

/* no background of its own anywhere: the reply bubble / tile / panel shows through */
html,body,#ccb-root,.ib,.ib .full,.ib .mini{background:transparent}

          return ct ? sm / ct - cross(v) / 2 : ctr[v];
        });
        var c1 = 0, placed = [];
        rk.forEach(function (v, k) { c1 = k ? Math.max(want[k], placed[k - 1] + cross(rk[k - 1]) + CG) : want[k]; placed.push(c1); });
        var shift = 0; rk.forEach(function (v, k) { shift += want[k] - placed[k]; }); shift = rk.length ? shift / rk.length : 0;
        if (shift > 0) { /* pushed right: nothing to pull back */ shift = 0; }
        rk.forEach(function (v, k) { ctr[v] = placed[k] + shift; });
        var mnc = Math.min.apply(null, rk.map(function (v) { return ctr[v]; }));
        if (mnc < 0) rk.forEach(function (v) { ctr[v] -= mnc; });
      }
      var gmin = Math.min.apply(null, ctr); if (gmin !== 0) for (var z = 0; z < n; z++) ctr[z] -= gmin;
    }
    var PAD = 4, crossMax = Math.max.apply(null, nodes.map(function (_, v) { return ctr[v] + cross(v); }));
    var box = nodes.map(function (nd, v) {
      var a = rankPos[rank[v]] + (rankExt[rank[v]] - along(v)) / 2, c = ctr[v];
      return LR ? { x: PAD + a, y: PAD + c, w: nd.w, h: nd.h } : { x: PAD + c, y: PAD + a, w: nd.w, h: nd.h };
    });
    /* ports */
    var inSide = LR ? 'left' : 'top', outSide = LR ? 'right' : 'bottom';
    var portsOf = {}; /* node|side → [{e, other}] */
    function addPort(v, side, e, other) { var k = v + '|' + side; (portsOf[k] = portsOf[k] || []).push({ e: e, other: other }); }
    edges.forEach(function (e, i) {
      var isBack = !!back[i] || e.f === e.t;
      if (isBack) { addPort(e.f, inSide, i, e.t); addPort(e.t, outSide, i, e.f); }
      else { addPort(e.f, outSide, i, e.t); addPort(e.t, inSide, i, e.f); }
    });
    var portPos = {};
    Object.keys(portsOf).forEach(function (k) {
      var v = +k.split('|')[0], list = portsOf[k];
      list.sort(function (a, b) { var A = ctr[a.other] + cross(a.other) / 2, B = ctr[b.other] + cross(b.other) / 2; return A - B || a.e - b.e; });
      var sz = cross(v), step = Math.min(13.3, (sz - 14) / Math.max(list.length, 1));
      list.forEach(function (p, j) { portPos[k + '|' + p.e] = (sz / 2) + (j - (list.length - 1) / 2) * step; });
    });
    function port(v, side, i) {
      var b = box[v], off = portPos[v + '|' + side + '|' + i];
      if (LR) return side === 'left' ? [b.x, b.y + off] : [b.x + b.w, b.y + off];
      return side === 'top' ? [b.x + off, b.y] : [b.x + off, b.y + b.h];
    }
    /* routes */
    var lanes = 0, laneBase = PAD + crossMax + 14, gapCount = {}, paths = [], maxLab = 0;
    var pairIdx = {};
    edges.forEach(function (e, i) {
      var isBack = !!back[i] || e.f === e.t, rs = rank[e.t] - rank[e.f];
      var a, b2, pts;
      if (!isBack && rs === 1) {
        a = port(e.f, outSide, i); b2 = port(e.t, inSide, i);
        var gs = rankPos[rank[e.f]] + rankExt[rank[e.f]] + PAD, ge = rankPos[rank[e.t]] + PAD;
        var key = rank[e.f]; pairIdx[key] = (pairIdx[key] || 0) + 1;
        var m = gs + (ge - gs) * 0.5;
        /* a small offset between the two ports would draw a kink: snap to one straight line when both nodes allow it */
        var ci = LR ? 1 : 0, ba = box[e.f], bb = box[e.t];
        var lo = Math.max(LR ? ba.y : ba.x, LR ? bb.y : bb.x) + 8, hi = Math.min(LR ? ba.y + ba.h : ba.x + ba.w, LR ? bb.y + bb.h : bb.x + bb.w) - 8;
        if (Math.abs(a[ci] - b2[ci]) <= 14 && lo <= hi) { var sn = Math.min(hi, Math.max(lo, (a[ci] + b2[ci]) / 2)); a[ci] = sn; b2[ci] = sn; }
        if (LR) pts = (Math.abs(a[1] - b2[1]) < 0.5) ? [a, b2] : [a, [m, a[1]], [m, b2[1]], b2];
        else pts = (Math.abs(a[0] - b2[0]) < 0.5) ? [a, b2] : [a, [a[0], m], [b2[0], m], b2];
      } else {
        var k = lanes++;
        if (isBack) { a = port(e.f, inSide, i); b2 = port(e.t, outSide, i); } else { a = port(e.f, outSide, i); b2 = port(e.t, inSide, i); }
        var lane = laneBase + k * 10;
        if (LR) {
          var xa = isBack ? a[0] - 14 - k * 3 : a[0] + 14 + k * 3, xb = isBack ? b2[0] + 14 + k * 3 : b2[0] - 14 - k * 3;
          if (e.f === e.t) { xa = a[0] - 14; xb = b2[0] + 14; }
          pts = [a, [xa, a[1]], [xa, lane], [xb, lane], [xb, b2[1]], b2];
        } else {
          var ya = isBack ? a[1] - 14 - k * 3 : a[1] + 14 + k * 3, yb = isBack ? b2[1] + 14 + k * 3 : b2[1] - 14 - k * 3;
          var lx = PAD + crossMax + 14 + k * 10;
          pts = [a, [a[0], ya], [lx, ya], [lx, yb], [b2[0], yb], b2];
        }
        var cleaned = [pts[0]]; for (var z2 = 1; z2 < pts.length; z2++) { var pr = cleaned[cleaned.length - 1]; if (Math.abs(pr[0] - pts[z2][0]) > 0.01 || Math.abs(pr[1] - pts[z2][1]) > 0.01) cleaned.push(pts[z2]); }
        pts = cleaned;
      }
      /* label on the longest segment, beside the line */
      var lab = null;
      if (e.label) {
        var best = 0, bs = null;
        for (var s3 = 0; s3 + 1 < pts.length; s3++) { var len = Math.abs(pts[s3 + 1][0] - pts[s3][0]) + Math.abs(pts[s3 + 1][1] - pts[s3][1]); if (len > best) { best = len; bs = [pts[s3], pts[s3 + 1]]; } }
        var lw = Math.ceil(tw(e.label, 12)) + 12, horiz = Math.abs(bs[1][1] - bs[0][1]) < 0.5, mx = (bs[0][0] + bs[1][0]) / 2, my = (bs[0][1] + bs[1][1]) / 2;
        lab = horiz ? { x: mx - lw / 2, y: my + 5, w: lw, t: e.label } : { x: mx - lw - 5, y: my - 9, w: lw, t: e.label };
      }
      paths.push({ d: roundPath(pts, 8), dash: edges[i].dash, lab: lab });
    });
    /* bounds */
    var W = PAD * 2 + (LR ? alongTotal : crossMax), H = PAD * 2 + (LR ? crossMax : alongTotal);
    if (lanes) { if (LR) H = Math.max(H, laneBase + (lanes - 1) * 10 + PAD + 4); else W = Math.max(W, PAD + crossMax + 14 + (lanes - 1) * 10 + PAD + 4); }
    var shiftX = 0, shiftY = 0;
    paths.forEach(function (p) { if (p.lab) { shiftX = Math.min(shiftX, p.lab.x - 2); W = Math.max(W, p.lab.x + p.lab.w + 4); H = Math.max(H, p.lab.y + 22); } });
    return { W: Math.ceil(W - shiftX), H: Math.ceil(H), box: box, paths: paths, shiftX: -shiftX };
  }

  var flowSeq = 0;
  R.flowchart = R.flow = function (b) {
    var dir = str(b.dir) || 'LR';
    if (dir !== 'LR' && dir !== 'TB') fail('dir', 'dir 必須是 LR 或 TB');
    var kinds = ['step', 'decision', 'start', 'end'], seen = {};
    var nodes = arr(b.nodes, 'nodes', 2).map(function (nd, i) {
      var p = 'nodes[' + i + ']'; obj(nd, p);
      var id = str(nd.id, p + '.id', true);
      if (seen[id]) fail(p + '.id', '節點 id 重複："' + id + '"'); seen[id] = 1;
      var kind = str(nd.kind) || 'step';
      if (kinds.indexOf(kind) < 0) fail(p + '.kind', p + '.kind 必須是 ' + kinds.join(' | '));
      return { id: id, label: str(nd.label, p + '.label', true), sub: str(nd.sub), st: status(nd.status, p + '.status'), kind: kind };
    });
    var idx = {}; nodes.forEach(function (nd, i) { idx[nd.id] = i; });
    var edges = (b.edges == null ? [] : arr(b.edges, 'edges', 0)).map(function (e, i) {
      var p = 'edges[' + i + ']'; obj(e, p);
      var f = str(e.from, p + '.from', true), t = str(e.to, p + '.to', true);
      if (!(f in idx)) fail(p + '.from', p + '.from 找不到節點 "' + f + '"（nodes 的 id：' + nodes.map(function (n) { return n.id; }).join(', ') + '）');
      if (!(t in idx)) fail(p + '.to', p + '.to 找不到節點 "' + t + '"（nodes 的 id：' + nodes.map(function (n) { return n.id; }).join(', ') + '）');
      var kind = str(e.kind) || 'solid';
      if (kind !== 'solid' && kind !== 'dashed') fail(p + '.kind', p + '.kind 必須是 solid 或 dashed');
      return { f: idx[f], t: idx[t], label: str(e.label), dash: kind === 'dashed' };
    });
    var uid = 'ibf' + (++flowSeq);
    function draw(d, tag) {
      var lay = layoutFlow(nodes, edges, d), mk = uid + tag;
      var svg = '<svg class="fl ' + tag + '" viewBox="0 0 ' + lay.W + ' ' + lay.H + '" width="' + lay.W + '" height="' + lay.H + '" style="max-width:' + lay.W + 'px" role="img" aria-label="' + h(nodes.map(function (n) { return n.label; }).join(' → ')) + '">' +
        '<defs><marker id="' + mk + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="ah"></path></marker></defs>' +
        '<g transform="translate(' + lay.shiftX + ' 0)">' +
        lay.paths.map(function (p) { return '<path class="edge' + (p.dash ? ' dash' : '') + '" d="' + p.d + '" marker-end="url(#' + mk + ')"></path>'; }).join('') +
        lay.paths.map(function (p) { return p.lab ? '<g class="el" transform="translate(' + f1(p.lab.x) + ' ' + f1(p.lab.y) + ')"><rect width="' + p.lab.w + '" height="18" rx="6"></rect><text x="' + p.lab.w / 2 + '" y="13" text-anchor="middle">' + h(p.lab.t) + '</text></g>' : ''; }).join('') +
        nodes.map(function (nd, v) {
          var bx = lay.box[v], tn = nd.st ? ST_TONE[nd.st] : '', hot = tn === 'bad' ? ' hot' : '';
          var g = '<g class="nd k-' + nd.kind + ' ' + tc(tn) + hot + '" transform="translate(' + f1(bx.x) + ' ' + f1(bx.y) + ')">';
          if (nd.kind === 'decision') {
            g += '<polygon class="nb" points="10,0 ' + (bx.w - 10) + ',0 ' + bx.w + ',20 ' + (bx.w - 10) + ',40 10,40 0,20"></polygon><text class="nt" x="' + bx.w / 2 + '" y="25" text-anchor="middle">' + h(nd.label) + '</text>';
          } else if (nd.kind === 'start' || nd.kind === 'end') {
            g += '<rect class="nb" width="' + bx.w + '" height="40" rx="20"></rect><text class="nt" x="' + bx.w / 2 + '" y="25" text-anchor="middle">' + h(nd.label) + '</text>';
          } else {
            g += '<rect class="nb" width="' + bx.w + '" height="' + bx.h + '" rx="12"></rect>' + (nd.st ? '<rect class="sb" x="0" y="10" width="3" height="' + (bx.h - 20) + '" rx="1.5"></rect>' : '') +
              '<text class="nt" x="16" y="25" text-anchor="start">' + h(nd.label) + '</text>';
            if (nd.st || nd.sub) g += '<text class="ns" x="16" y="44" text-anchor="start">' + (nd.st ? '<tspan class="sc">' + L[nd.st] + '</tspan>' : '') + (nd.st && nd.sub ? ' · ' : '') + h(nd.sub) + '</text>';
          }
          return g + '</g>';
        }).join('') + '</g></svg>';
      return svg;
    }
    var wide = draw(dir, 'wide'), narrow = dir === 'LR' ? draw('TB', 'narrow') : '';
    var bad = nodes.filter(function (n) { return n.st === 'blocked' || n.st === 'risk'; })[0];
    return {
      html: fig('flowchart', b, '<div class="fl-wrap">' + wide + narrow + '</div>', narrow ? 'has-narrow' : ''),
      sum: { big: bad ? cut(bad.label, 16) : L.nodes(nodes.length), sub: bad ? L[bad.st] : str(b.title), tone: bad ? 'bad' : '' }
    };
  };

  /* ───────── data → block ───────── */
  var TYPES = ['kpi', 'table', 'options', 'proscons', 'checklist', 'progress', 'timeline', 'roadmap', 'steps', 'callout', 'matrix', 'flowchart', 'sequence', 'prose', 'quote', 'glossary', 'sources', 'image'];
  var EX = {
    kpi: '{"type":"kpi","items":[{"label":"冷啟動","value":1.4,"unit":"s","delta":"-42%","deltaDir":"down_good"}]}',
    table: '{"type":"table","columns":["工作線","狀態"],"rows":[["面板",{"text":"已安裝","status":"done"}]]}',
    options: '{"type":"options","criteria":["成本","風險"],"options":[{"name":"A","recommended":true,"cells":[{"text":"低","tone":"good"},{"text":"中","tone":"warn"}]},{"name":"B","cells":[{"text":"高","tone":"bad"},{"text":"低","tone":"good"}]}]}',
    proscons: '{"type":"proscons","pros":["快"],"cons":["貴"],"verdict":"值得"}',
    checklist: '{"type":"checklist","items":[{"label":"安裝","status":"done"},{"label":"同步","status":"blocked","note":"等 API"}]}',
    progress: '{"type":"progress","items":[{"label":"遷移","value":34,"max":52,"status":"active"}]}',
    timeline: '{"type":"timeline","items":[{"start":"10/27 21:10","label":"上線","status":"done"}]}',
    roadmap: '{"type":"roadmap","columns":[{"title":"現在","items":[{"label":"IPC","status":"active"}]},{"title":"之後","items":[{"label":"打包"}]}]}',
    steps: '{"type":"steps","items":[{"title":"補 API","text":"改讀 /bots","status":"active"},{"title":"測試"}]}',
    callout: '{"type":"callout","tone":"warn","title":"還沒驗證","text":"數字來自開發機。"}',
    matrix: '{"type":"matrix","rows":["P0","P1"],"cols":["受阻","完成"],"cells":[[["安裝"],null],[null,["面板"]]]}',
    flowchart: '{"type":"flowchart","nodes":[{"id":"a","label":"實作","status":"done"},{"id":"b","label":"安裝","status":"blocked"}],"edges":[{"from":"a","to":"b"}]}',
    sequence: '{"type":"sequence","actors":["手機","Core"],"steps":[{"from":"手機","to":"Core","label":"GET /bots"}]}',
    prose: '{"type":"prose","text":"CPU 從 **9.8%** 降到 *2.1%*。"}',
    quote: '{"type":"quote","text":"只看得到 Main。","source":"使用者回報"}',
    glossary: '{"type":"glossary","items":[{"term":"SESS","plain":"一種前處理。"}]}',
    sources: '{"type":"sources","items":[{"ref":"a58c883","text":"面板已安裝"}]}',
    image: '{"type":"image","src":"data:image/png;base64,…","alt":"側欄截圖"}'
  };

  function parseData(raw) {
    var d = raw;
    if (typeof d === 'string') {
      var s = d.trim();
      if (!s) fail('data', '資料是空的');
      try { d = JSON.parse(s); } catch (e) { fail('data', '不是有效的 JSON：' + e.message); }
    }
    if (d && typeof d === 'object' && typeof d.output === 'string' && !d.type) { try { d = JSON.parse(d.output); } catch (e) { /* keep d */ } }
    if (Array.isArray(d)) { if (d.length === 1) d = d[0]; else fail('data', '資料是陣列；一次只能放一個區塊（收到 ' + d.length + ' 個）'); }
    if (d == null) fail('data', '沒有收到資料（ccb.data 是空的）');
    if (!isObj(d)) fail('data', '資料必須是一個區塊物件，收到 ' + typeof d);
    if (!d.type && isObj(d.block)) d = d.block;
    if (!d.type && Array.isArray(d.sections)) fail('type', '這是整份報告（有 sections）；本元件一次只畫一個區塊。請取出其中一個 block 當資料。');
    if (!d.type) fail('type', '缺少 type（區塊類型：' + TYPES.join(', ') + '）');
    return d;
  }

  function build(raw) {
    var b, type = '';
    try {
      b = parseData(raw);
      type = String(b.type);
      var key = type === 'flow' ? 'flowchart' : type;
      L = T[(b.lang === 'en' || b.lang === 'zh-Hant') ? (b.lang === 'en' ? 'en' : 'zh') : (/[⺀-鿿]/.test(JSON.stringify(b)) ? 'zh' : 'en')];
      if (key === 'figure' || key === 'experiment') fail('type', '「' + type + '」區塊要由報告頁產生（matplotlib / 完整報告），行內元件畫不出來。請改用其他區塊，或發佈完整報告頁。');
      if (!R.hasOwnProperty(key)) fail('type', '不認得的區塊類型 "' + type + '"。支援：' + TYPES.join(', '));
      var res = R[key](b);
      return { ok: true, html: res.html, sum: res.sum };
    } catch (e) {
      if (!(e instanceof BlockError)) { e = new BlockError('', '渲染時發生例外：' + (e && e.message ? e.message : e)); }
      L = T.zh;
      return { ok: false, type: type, err: e };
    }
  }

  function errCard(type, e) {
    var ex = EX[type === 'flow' ? 'flowchart' : type];
    return '<aside class="blk blk-error" role="alert"><p><b>' + h(type ? L.badBlock(type) : L.badData) + '</b><span>' + h(e.msg) + '</span></p>' +
      (e.path ? '<p class="em">位置：<code>' + h(e.path) + '</code></p>' : '') +
      (ex ? '<p class="em">' + L.example + '：<code>' + h(ex) + '</code></p>' : '') + '</aside>';
  }

  var GL = { good: '✓', bad: '!', warn: '!', info: '', neutral: '' };
  function mini(sum) {
    return '<div class="mini ' + tc(sum.tone) + '"><b>' + h(sum.big) + '</b>' + (sum.sub ? '<span>' + h(cut(sum.sub, 32)) + '</span>' : '') + '</div>';
  }

  function draw() {
    var r = build(ccb.data), sum;
    if (r.ok) {
      root.innerHTML = '<div class="full">' + r.html + '</div>' + mini(r.sum);
      sum = r.sum;
    } else {
      sum = { big: T.zh.badData, sub: r.err.msg, tone: 'bad' };
      root.innerHTML = '<div class="full">' + errCard(r.type, r.err) + '</div>' + mini(sum);
    }
    var tn = sum.tone === 'bad' ? 'bad' : sum.tone === 'warn' ? 'warning' : sum.tone === 'good' ? 'good' : 'neutral';
    try { if (typeof ccb.setStatus === 'function') ccb.setStatus({ text: cut(sum.big, 14), tone: tn }); } catch (e) { /* chip is optional */ }
  }

  /* size: decided in JS (the container-query route stays out of the chat, where the frame's height follows the content) */
  function surface() { return (window.ccb && ccb.surface) || document.documentElement.getAttribute('data-surface') || 'chat'; }
  function applySize(sz) {
    var px = (sz && sz.px) || (window.ccb && ccb.size && ccb.size.px) || {};
    var tiny = false, narrow = false;
    if (surface() !== 'chat') {
      tiny = (px.width > 0 && px.width <= 210) || (px.height > 0 && px.height <= 120);
    }
    if (px.width > 0 && px.width <= 330) narrow = true;
    root.setAttribute('data-tiny', tiny ? '1' : '0');
    root.setAttribute('data-narrow', narrow ? '1' : '0');
  }

  function snap() { try { return JSON.stringify(ccb.data); } catch (e) { return String(Math.random()); } }
  var last = snap();
  function redraw() { last = snap(); try { applySize(); draw(); } catch (e) { fatal(e); } }
  redraw();
  if (typeof ccb.onData === 'function') ccb.onData(function () { redraw(); });
  if (typeof ccb.onSize === 'function') ccb.onSize(function (sz) { applySize(sz); });
  /* data that arrives without an event (or after the first draw) is picked up here */
  setInterval(function () { if (snap() !== last) redraw(); }, 700);
  } catch (e) { fatal(e); }
})();
</script>
