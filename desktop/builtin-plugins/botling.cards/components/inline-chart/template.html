/* Theme: one set of semantic variables (T3 style), mapped onto the host's tokens. The ccb-kit marker above makes the frame inject

  --t-chart-1:#2F6FE0;--t-chart-2:#B26A00;--t-chart-3:#1E8A55;--t-chart-4:#C2603F;--t-chart-5:#2F6FE0;--t-chart-6:#7A7A83;--t-popover:#FFFFFF;--t-shadow:0 6px 20px rgba(0,0,0,.14);

.lg i.rk::before{content:"";position:absolute;left:0;right:0;top:50%;height:calc(var(--ccb-stroke) * 1.5);margin-top:calc(var(--ccb-stroke) * -0.75);background:var(--wk)}

/* stacked: label | track (one shared linear x axis); the bar is a flex row of segments (width ∝ value, at least a sliver each),

.ch{--s-good:var(--t-chart-3);--s-accent:var(--t-chart-1);--s-warn:var(--t-chart-2);--s-bad:var(--t-destructive)}
