<!doctype html>
<!-- A FIXTURE: ChatGPT's turns after a markup change that dropped the [data-message-author-role]
     elements and the .markdown class: only the <article data-turn> wrappers remain. The reader
     still finds each turn and reads it whole, without the screen-reader headings or buttons. -->
<html>
<head><title>Short chat</title></head>
<body><main>
  <article data-turn="user"><h5 class="sr-only">You said:</h5><div><div>Name a prime.</div></div><button>Edit</button></article>
  <article data-turn="assistant"><h6 class="sr-only">ChatGPT said:</h6><div><p>Seven: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>7</mn><mo>∈</mo><mi mathvariant="double-struck">P</mi></mrow><annotation encoding="application/x-tex">7 \in \mathbb{P}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6835em;vertical-align:-0.0391em;"></span><span class="mord">7</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6889em;"></span><span class="mord mathbb">P</span></span></span></span>.</p></div><div><button aria-label="Copy">Copy</button></div></article>
</main></body>
</html>
